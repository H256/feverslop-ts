name: Checks

on:
    push:
    pull_request:
    workflow_call:

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.13'
            - run: bun install --frozen-lockfile
            - run: bun run test
            - run: bun run typecheck
