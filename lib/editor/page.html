<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace</title>
<script>
// before the first paint, so that a chosen theme does not flash the other one
document.documentElement.dataset.theme = localStorage.getItem('theme') ?? 'system'
</script>
<style>
:root {
    color-scheme: light dark;
    --bg: light-dark(#f3f3f1, #0d0e10);
    --surface: light-dark(#ffffff, #15171a);
    --raised: light-dark(#ecebe8, #1e2125);
    --hover: light-dark(#e3e2de, #272b30);
    --line: light-dark(#dddcd7, #292d32);
    --text: light-dark(#191a1c, #eceef1);
    --muted: light-dark(#5f6269, #9a9fa8);
    --accent: light-dark(#cf3d1b, #ff6f4d);
    --accent-text: light-dark(#ffffff, #1a0d09);
    --accent-soft: light-dark(#fbe6e0, #3a1d15);
    --stale: light-dark(#8f6200, #f2bd3a);
    --stale-soft: light-dark(#f8ecc9, #3a2d0c);
    --danger: light-dark(#b42318, #ff7a70);
    --danger-soft: light-dark(#fbe4e1, #3b1a18);
    --ok: light-dark(#17693f, #5ed29a);
    --hatch: light-dark(#d6d5d0, #24272b);
    --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --mono: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace;
    --radius: 8px;
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.page { min-height: 0; min-width: 0; }
.spacer { flex: 1; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.mark { width: 18px; height: 18px; flex: none; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: var(--accent-text); }
.top h1 { flex: none; max-width: 28vw; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; gap: 2px; flex: none; }
.nav a { padding: 3px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--text); background: var(--raised); }
.nav a[aria-current=page] { color: var(--text); background: var(--raised); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; background: var(--raised); color: var(--muted); font-size: 12px; white-space: nowrap; border: 0; }
.chip.stale { background: var(--stale-soft); color: var(--stale); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.good { color: var(--ok); }
button.chip:hover { color: var(--text); }
.chips { display: flex; gap: 6px; min-width: 0; overflow: hidden; flex: 0 1 auto; }
.chips .chip { flex: none; }
.chips .chip.next { flex: 0 1 auto; display: block; min-width: 60px; overflow: hidden; text-overflow: ellipsis; }
.theme { display: flex; flex: none; padding: 2px; gap: 2px; border-radius: 8px; background: var(--raised); border: 0; margin: 0; }
.theme legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.theme label { display: grid; place-items: center; width: 28px; height: 24px; border-radius: 6px; color: var(--muted); cursor: pointer; }
.theme label:hover { color: var(--text); }
.theme input { position: absolute; opacity: 0; pointer-events: none; }
.theme input:checked + label { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px #0003; }
.theme input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* buttons and fields */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.field { display: block; margin-bottom: 10px; }
.field > span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
input[type=text], input[type=search], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
.field input, .field textarea, .field select, .section > textarea { width: 100%; }
textarea { font: 12px/1.6 var(--mono); resize: vertical; }

/* monitor and inspector */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.monitor { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
/* a monitor stays dark in both themes: a picture is judged against black */
.stage { position: relative; background: #000; min-height: 0; overflow: hidden; }
.stage video, .stage .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage .poster { opacity: .35; }
.notice { position: absolute; left: 50%; top: 50%; translate: -50% -50%; color: #fff; background: #000a; padding: 6px 14px; border-radius: 99px; font-size: 13px; white-space: nowrap; }
.preview-flag { position: absolute; left: 12px; top: 12px; color: #fff; background: #000a; padding: 2px 10px; border-radius: 99px; font-size: 12px; }
.transport { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-top: 1px solid var(--line); min-width: 0; }
.tbtn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; border: 0; background: transparent; color: var(--text); flex: none; }
.tbtn:hover { background: var(--raised); }
.tbtn.play { background: var(--accent); color: var(--accent-text); }
.tbtn.play:hover { background: var(--accent); filter: brightness(1.1); }
.tbtn.play svg { fill: currentColor; stroke: none; }
.time { font: 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.now { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
select.source { padding: 1px 6px; font-size: 12px; color: var(--muted); }

.inspector { display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: var(--surface); border-left: 1px solid var(--line); min-height: 0; min-width: 0; }
.ihead { padding: 12px 14px 8px; }
.ihead h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; font-family: var(--mono); }
.ihead p { color: var(--muted); }
.ihead .warn { margin: 6px 0 0; }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 7px 8px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); margin-bottom: -1px; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected=true] { color: var(--text); border-color: var(--accent); font-weight: 500; }
.tabs small { color: var(--muted); font-size: 11px; margin-left: 2px; }
.panel { overflow-y: auto; padding: 12px 14px 20px; min-height: 0; }
.empty { color: var(--muted); padding: 32px 16px; text-align: center; }
.prompt { font: 12px/1.65 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.token { color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 2px; }
.section { margin-bottom: 16px; }
.section > h3 { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.shot { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; }
.shot header { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.shot header span:last-child { color: var(--muted); font-weight: 400; white-space: nowrap; }
.shot .how { color: var(--muted); font-size: 12px; }
.shot p + p, .shot .how + p { margin-top: 4px; }
.person { font-size: 12px; color: var(--muted); margin-top: 3px; }
.person b { color: var(--text); font-weight: 500; }
.line { display: grid; grid-template-columns: 44px 1fr; gap: 6px; margin-bottom: 5px; }
.line time { color: var(--muted); font: 12px var(--mono); }
.line small { display: block; color: var(--muted); }
.refs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ref { display: block; width: 100%; padding: 0; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-align: left; }
.ref:hover { border-color: var(--muted); }
.ref.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ref img, .ref .noimg { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--hatch); }
.ref .noimg { display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.ref div { padding: 5px 8px 6px; }
.ref b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref small { color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 6px; }
.ref small .stale { color: var(--stale); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-family: var(--mono); }
.frames { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.frames figure { margin: 0; }
.frames img { width: 100%; display: block; border-radius: 6px; background: #000; cursor: zoom-in; }
.frames figcaption { color: var(--muted); font-size: 12px; margin-top: 2px; }
.cmd { display: flex; align-items: flex-start; gap: 6px; background: var(--raised); border-radius: 6px; padding: 6px 6px 6px 10px; margin-bottom: 6px; }
.cmd code { flex: 1; font: 12px/1.5 var(--mono); overflow-wrap: anywhere; }
.cmd button { flex: none; border: 0; background: transparent; border-radius: 5px; color: var(--muted); padding: 3px; }
.cmd button:hover { background: var(--hover); color: var(--text); }
.warn { background: var(--stale-soft); color: var(--stale); padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
.warn.bad { background: var(--danger-soft); color: var(--danger); }
.note { background: var(--raised); padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
.version { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }
.version img, .version .noimg { width: 92px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; background: var(--hatch); display: block; }
.version .btn-row { margin-top: 5px; }

/* timeline */
.timeline { background: var(--surface); border-top: 1px solid var(--line); min-width: 0; }
.tbar { display: flex; align-items: center; gap: 12px; padding: 5px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.legend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; white-space: nowrap; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.legend label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.zoom { display: flex; align-items: center; gap: 6px; color: var(--muted); flex: none; }
.zoom input { width: 120px; accent-color: var(--accent); }
.zoom button, .legend button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 0 8px; color: var(--muted); }
.zoom button:hover, .legend button:hover { color: var(--text); background: var(--raised); }
.tbody { display: grid; grid-template-columns: 62px minmax(0, 1fr); }
.labels { border-right: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.labels div { display: flex; align-items: center; padding-left: 12px; }
.lane-ruler { height: 22px; }
.lane-groups { height: 22px; }
.lane-wave { height: 40px; }
.lane-clips { height: 72px; }
.lane-lines { height: 20px; }
.scroll { overflow-x: auto; overflow-y: hidden; position: relative; scrollbar-width: thin; }
.track { position: relative; width: calc(var(--seconds) * var(--pps) * 1px); min-width: 100%; }
.lane { position: relative; overflow: hidden; }
.lane canvas { position: sticky; left: 0; display: block; }
.lane-ruler, .lane-wave, .lane-groups, .lane-lines { cursor: text; }
.group, .spoken, .clip { position: absolute; left: calc(var(--s) * var(--pps) * 1px); width: calc(var(--d) * var(--pps) * 1px); }
.group { top: 2px; bottom: 2px; border-radius: 4px; padding: 0 6px; font-size: 11px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: light-dark(oklch(.92 .05 var(--h)), oklch(.31 .06 var(--h))); color: light-dark(oklch(.32 .09 var(--h)), oklch(.89 .07 var(--h))); border-right: 1px solid var(--surface); }
.spoken { top: 2px; bottom: 2px; border-radius: 3px; padding: 0 4px; font-size: 11px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: clip; background: var(--raised); color: var(--muted); border-right: 1px solid var(--surface); container-type: inline-size; }
@container (width < 44px) { .spoken span { display: none; } }
.clip { top: 3px; bottom: 3px; padding: 0; border: 0; border-radius: 5px; overflow: hidden; background: var(--raised); container-type: inline-size; outline-offset: -2px; }
.clip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.clip::after { content: ""; position: absolute; inset: 0; border-radius: 5px; box-shadow: inset 0 0 0 1px #ffffff1f; pointer-events: none; }
.clip:hover::after { box-shadow: inset 0 0 0 1.5px #fff9; }
.clip.selected::after { box-shadow: inset 0 0 0 2px var(--accent); }
.clip .tag { position: absolute; left: 4px; top: 3px; color: #fff; font: 11px var(--mono); padding: 0 4px; border-radius: 3px; background: #000a; }
.clip .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff8; }
.clip.missing { background: repeating-linear-gradient(135deg, var(--hatch) 0 5px, transparent 5px 10px); box-shadow: inset 0 0 0 1px var(--line); }
.clip.missing img { opacity: .25; }
.clip.missing .tag { background: transparent; color: var(--muted); }
.clip.stale::before { content: ""; position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 4px; background: var(--stale); }
.clip.stale .tag { top: 6px; }
.clip .goes { position: absolute; z-index: 1; left: 3px; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1.5px #000a; }
.clip .flag { position: absolute; z-index: 1; right: 3px; bottom: 3px; width: 8px; height: 8px; border-radius: 2px; background: var(--danger); box-shadow: 0 0 0 1.5px #000a; }
.clip .has-preview { position: absolute; z-index: 1; right: 3px; top: 3px; font: 10px var(--mono); color: #fff; background: #000a; border-radius: 3px; padding: 0 3px; }
.dimmed .clip:not(.flagged) { opacity: .25; }
.clip.marked { outline: 2px solid var(--text); }
.clip .ticked { position: absolute; z-index: 2; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 3px; background: var(--text); color: var(--bg); font-size: 11px; line-height: 14px; text-align: center; }
.clip.marked .tag { left: 20px; }
.clip .progress { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 4px; font: 10px var(--mono); line-height: 15px; color: #fff; background: #000c; white-space: nowrap; overflow: hidden; }
.clip.p-rendering .progress { background: var(--accent); color: var(--accent-text); animation: pulse 1.4s infinite; }
.clip.p-done .progress { background: var(--ok); color: #06140c; }
@container (width < 48px) { .clip .progress { color: transparent; } }
.peek { position: fixed; z-index: 6; width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; pointer-events: none; box-shadow: 0 6px 24px #0006; }
.peek img, .peek video { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; }
.peek div { padding: 3px 8px; font-size: 12px; }
.stage-note { position: absolute; right: 12px; top: 12px; color: #fff; background: #7a5a00e6; padding: 2px 10px; border-radius: 99px; font-size: 12px; }
.reviewbar { position: absolute; left: 50%; bottom: 12px; translate: -50% 0; display: flex; gap: 10px; align-items: center; color: #fff; background: #000c; padding: 5px 12px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
.reviewbar b { font-family: var(--mono); font-weight: 500; }
.reviewbar kbd, .help kbd { font: 11px var(--mono); padding: 0 5px; border: 1px solid #fff6; border-radius: 4px; }
.help kbd { border-color: var(--line); background: var(--raised); }
.failbar { display: flex; gap: 10px; align-items: center; padding: 5px 12px; background: var(--danger-soft); color: var(--danger); border-top: 1px solid var(--line); font-size: 12px; }
.failbar span { min-width: 0; }
.help { width: 620px; max-height: 80vh; overflow: auto; padding: 16px 18px; }
.help h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.help h3 { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
.help dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 0; }
.help dt { white-space: nowrap; }
.help dd { margin: 0; color: var(--muted); }
@container (width < 48px) { .clip .tag { display: none; } }
@container (width < 14px) { .clip .goes { display: none; } }
.playhead { position: absolute; top: 0; bottom: 0; left: calc(var(--t, 0) * var(--pps) * 1px); width: 1.5px; background: var(--accent); pointer-events: none; z-index: 3; }
.playhead::before { content: ""; position: absolute; left: -4.25px; top: 0; width: 10px; height: 10px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 45%, 50% 100%, 0 45%); }

/* lists of cards: the start page, the library, the references, the casting */
.scrollpage { overflow-y: auto; height: 100%; padding: 16px 20px 40px; }
.pagebar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.pagebar h2 { font-size: 16px; font-weight: 600; }
.pagebar input[type=search] { width: 240px; }
.seg { display: flex; padding: 2px; gap: 2px; background: var(--raised); border-radius: 8px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 2px 10px; border-radius: 6px; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px #0003; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; text-align: left; padding: 0; width: 100%; }
.card:hover { border-color: var(--muted); }
.card-link { display: block; text-decoration: none; color: inherit; }
.card .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--muted); padding: 4px 10px; font-size: 12px; text-align: left; }
.card .more:hover { color: var(--text); background: var(--raised); }
.pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 16px; }
.pager .btn[aria-current=page] { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.servers { display: flex; gap: 10px; flex: none; font-size: 12px; color: var(--muted); }
.server { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.server i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.server.busy i { background: var(--stale); }
.server.down i { background: var(--danger); }
.pick { border: 0; padding: 0; margin: 8px 0 0; }
.pick legend { padding: 0; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
.pick label { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
.pick label.down { color: var(--muted); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .thumb { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px); }
.card .body { padding: 8px 10px 10px; display: block; }
.card .name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.card .next { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { display: block; height: 3px; background: var(--raised); margin-top: 6px; border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 460px; height: 100%; min-height: 0; }
.detail { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 30px; min-height: 0; }
.detail > img, .detail > video { width: 100%; display: block; background: #000; border-radius: 6px; margin-bottom: 10px; cursor: zoom-in; }
.detail h2 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.strip img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; background: #000; cursor: zoom-in; display: block; }
.role { display: grid; grid-template-columns: 96px minmax(0, 1fr) 260px; gap: 12px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; align-items: center; }
.role img, .role .noimg { width: 96px; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; background: var(--hatch); display: block; }
.role .warn { margin: 4px 0 0; }

/* the run: what goes on, at the foot of every page */
.rundock { background: var(--surface); border-top: 1px solid var(--line); min-width: 0; }
.runbar { display: flex; gap: 10px; align-items: center; padding: 5px 12px; min-width: 0; }
.runbar code { font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; animation: pulse 1.4s infinite; }
.dot.done { animation: none; background: var(--muted); }
.dot.failed { animation: none; background: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }
.runlog { height: 220px; overflow: auto; margin: 0; padding: 8px 12px; font: 12px/1.5 var(--mono); background: var(--bg); border-top: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); padding: 0; max-width: min(92vw, 1200px); max-height: 90vh; }
dialog::backdrop { background: #000a; }
.viewer img { display: block; max-width: 100%; max-height: 68vh; margin: 0 auto; background: #000; }
.viewer .caption { padding: 12px 16px; max-height: 20vh; overflow: auto; }
.viewer .caption p { color: var(--muted); font-size: 12px; margin-top: 2px; }
.viewer form { position: absolute; right: 8px; top: 8px; margin: 0; }
.viewer form button { border: 0; border-radius: 6px; background: #000a; color: #fff; padding: 3px 9px; }
.ask { width: 480px; padding: 16px 18px; }
.ask h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.ask p { margin-bottom: 6px; }
.ask .btn-row { justify-content: flex-end; margin-top: 12px; }
.compare { width: min(92vw, 1200px); padding: 12px; }
.compare .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare video { width: 100%; background: #000; border-radius: 6px; display: block; }
.compare .btn-row { margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: 20px; translate: -50% 0; background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 8px; z-index: 10; max-width: 80vw; }
.toast.bad { background: var(--danger); color: #fff; }

.boot { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 24px; }
.boot code { font-family: var(--mono); color: var(--text); }

@media (max-width: 960px) {
    body { overflow: auto; }
    .app { height: auto; }
    .work, .split { grid-template-columns: minmax(0, 1fr); }
    .stage { aspect-ratio: 16/9; }
    .inspector { border-left: 0; border-top: 1px solid var(--line); max-height: 60vh; }
    .chips { display: none; }
    .role { grid-template-columns: 72px minmax(0, 1fr); }
    .role > :last-child { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) { .tbtn, .clip::after, .theme label { transition: background-color .12s, box-shadow .12s; } }
</style>
</head>
<body>
<div class="app">
    <header class="top">
        <a class="mark" href="/" title="All projects" aria-label="All projects"><svg class="icon" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="M6 4v16l14-8z" fill="currentColor" stroke="none"/></svg></a>
        <h1 id="title">Workspace</h1>
        <nav class="nav" id="nav"></nav>
        <div class="chips" id="chips"></div>
        <div class="spacer"></div>
        <div class="servers" id="servers" aria-label="Render servers"></div>
        <nav class="nav"><a href="/" id="link-home">Projects</a><a href="/library" id="link-library">Library</a></nav>
        <fieldset class="theme" id="theme">
            <legend>Theme</legend>
            <input type="radio" name="theme" id="theme-system" value="system"><label for="theme-system" title="Follow the system setting"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span hidden>System</span></label>
            <input type="radio" name="theme" id="theme-light" value="light"><label for="theme-light" title="Light"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span hidden>Light</span></label>
            <input type="radio" name="theme" id="theme-dark" value="dark"><label for="theme-dark" title="Dark"><svg class="icon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><span hidden>Dark</span></label>
        </fieldset>
    </header>

    <div class="page" id="page">
        <div class="boot" id="boot">Loading…</div>
        <div class="scrollpage" id="view-list" hidden></div>
        <div class="split" id="view-split" hidden><div class="scrollpage" id="split-list"></div><aside class="detail" id="split-detail"></aside></div>
        <div id="view-timeline" hidden style="display:grid;grid-template-rows:minmax(0,1fr) auto auto;height:100%;min-height:0">
            <main class="work">
                <section class="monitor" aria-label="Monitor">
                    <div class="stage" id="stage">
                        <video id="video-a" playsinline preload="auto"></video>
                        <video id="video-b" playsinline preload="auto" hidden></video>
                        <img class="poster" id="poster" alt="" hidden>
                        <div class="notice" id="notice" hidden></div>
                        <div class="preview-flag" id="preview-flag" hidden></div>
                        <div class="stage-note" id="stage-note" hidden></div>
                        <div class="reviewbar" id="reviewbar" hidden></div>
                    </div>
                    <div class="transport">
                        <button class="tbtn" id="prev" title="Previous clip (←)" aria-label="Previous clip"><svg class="icon" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z"/></svg></button>
                        <button class="tbtn play" id="play" title="Play or pause (Space)" aria-label="Play"><svg class="icon" viewBox="0 0 24 24"><path id="play-icon" d="M7 4v16l13-8z"/></svg></button>
                        <button class="tbtn" id="next" title="Next clip (→)" aria-label="Next clip"><svg class="icon" viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
                        <span class="time"><span id="time-now">0:00.0</span> <span class="muted">/ <span id="time-all">0:00</span></span></span>
                        <span class="now muted" id="now"></span>
                        <div class="spacer"></div>
                        <span class="chip num" id="speed" hidden></span>
                        <button class="chip" id="loop-chip" title="Stop the loop (O)" hidden></button>
                        <span class="chip num" id="playing" hidden></span>
                        <select class="source" id="source" title="What the monitor plays" aria-label="What the monitor plays"></select>
                        <button class="tbtn" id="help-open" title="Keys and words (?)" aria-label="Keys and words">?</button>
                        <button class="tbtn" id="mute" title="Sound on or off (M)" aria-label="Sound on or off"><svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sound-waves" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg></button>
                    </div>
                </section>
                <aside class="inspector" aria-label="Clip">
                    <div class="ihead" id="ihead"></div>
                    <div class="tabs" role="tablist" id="tabs"></div>
                    <div class="panel" role="tabpanel" id="panel"></div>
                </aside>
            </main>
            <div class="failbar" id="failbar" hidden></div>
            <section class="timeline" aria-label="Timeline">
                <div class="tbar">
                    <div class="legend" id="legend"></div>
                    <div class="spacer"></div>
                    <div class="zoom">
                        <button id="fit" title="Show the whole video">Fit</button>
                        <label for="zoom" class="muted">Zoom</label>
                        <input type="range" id="zoom" min="0" max="100" value="0" title="Ctrl + wheel over the timeline">
                    </div>
                </div>
                <div class="tbody">
                    <div class="labels" aria-hidden="true">
                        <div class="lane-ruler"></div>
                        <div class="lane-groups" id="groups-label"></div>
                        <div class="lane-wave" id="wave-label">Sound</div>
                        <div class="lane-clips">Clips</div>
                        <div class="lane-lines" id="lines-label"></div>
                    </div>
                    <div class="scroll" id="scroll">
                        <div class="track" id="track">
                            <div class="lane lane-ruler" id="seek-ruler"><canvas id="ruler"></canvas></div>
                            <div class="lane lane-groups" id="groups"></div>
                            <div class="lane lane-wave" id="seek-wave"><canvas id="wave"></canvas></div>
                            <div class="lane lane-clips" id="clips"></div>
                            <div class="lane lane-lines" id="lines"></div>
                            <div class="playhead" id="playhead"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <section class="rundock" id="rundock" hidden aria-label="Run">
        <div class="runbar">
            <span class="dot" id="run-dot"></span>
            <span id="run-state"></span>
            <code id="run-command"></code>
            <div class="spacer"></div>
            <button class="btn" id="run-log-toggle">Log</button>
            <button class="btn danger" id="run-stop" hidden>Stop</button>
            <button class="btn" id="run-close" hidden aria-label="Close">✕</button>
        </div>
        <pre class="runlog" id="run-log" hidden></pre>
    </section>
</div>
<audio id="song" preload="auto" hidden></audio>
<dialog class="viewer" id="viewer"><form method="dialog"><button aria-label="Close">✕</button></form><img id="viewer-img" alt=""><div class="caption" id="viewer-caption"></div></dialog>
<dialog class="ask" id="ask"></dialog>
<dialog class="compare" id="compare"></dialog>
<dialog class="help" id="help"></dialog>
<div class="peek" id="peek" hidden></div>

<script type="module">
const $ = id => document.getElementById(id)

/** A DOM element: text always goes in as text, never as markup - prompts and names come from a language model. */
function el(tag, props = {}, ...children) {
    const node = document.createElement(tag)
    for (const [key, value] of Object.entries(props)) {
        if (value === undefined || value === null || value === false) continue
        if (key === 'class') node.className = value
        else if (key === 'style') for (const [name, v] of Object.entries(value)) node.style.setProperty(name, v)
        else if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
        else if (key in node && key !== 'list') node[key] = value
        else node.setAttribute(key, value)
    }
    node.append(...children.flat(3).filter(child => child !== undefined && child !== null && child !== false && child !== ''))
    return node
}

////////// WHERE WE ARE - every page is an address of its own
const parts = location.pathname.split('/').filter(Boolean).map(decodeURIComponent)
const route = parts[0] === 'p' ? {view: 'project', kind: parts[1], id: parts[2], page: parts[3] ?? 'timeline'} : parts[0] === 'library' ? {view: 'library'} : {view: 'home'}
const base = route.view === 'project' ? `/p/${route.kind}/${encodeURIComponent(route.id)}` : ''
const encoded = file => file.split('/').map(encodeURIComponent).join('/')
const mediaUrl = ({file, v}, root = `${base}/media`) => `${root}/${encoded(file)}${v ? `?v=${v}` : ''}`
const thumbUrl = ({file, v}, width = 320, root = `${base}/thumb`) => `${root}/${encoded(file)}?w=${width}${v ? `&v=${v}` : ''}`

async function api(path, body) {
    const response = await fetch(`${base}/api/${path}`, body === undefined ? undefined : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    const data = await response.json().catch(() => ({}))
    if (!response.ok) throw new Error(data.error ?? `${response.status}`)
    return data
}

function toast(text, bad = false) {
    document.querySelector('.toast')?.remove()
    const node = el('div', {class: `toast${bad ? ' bad' : ''}`, role: 'status'}, text)
    document.body.append(node)
    setTimeout(() => node.remove(), bad ? 7000 : 3000)
}
const showError = error => toast(error.message ?? String(error), true)

const clock = (seconds, precise = true) => {
    const whole = Math.max(0, seconds)
    const minutes = Math.floor(whole / 60)
    const rest = whole - minutes * 60
    return precise ? `${minutes}:${rest.toFixed(1).padStart(4, '0')}` : `${minutes}:${String(Math.floor(rest)).padStart(2, '0')}`
}
const clamp = (value, low, high) => Math.min(high, Math.max(low, value))
const dateOf = ms => new Date(ms).toLocaleString(undefined, {dateStyle: 'short', timeStyle: 'short'})
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`

function show(view) {
    $('boot').hidden = true
    for (const id of ['view-list', 'view-split', 'view-timeline']) $(id).hidden = id !== view
}

////////// THEME - the system's, or a choice kept in this browser
const themeInputs = [...document.querySelectorAll('#theme input')]
for (const input of themeInputs) {
    input.checked = input.value === document.documentElement.dataset.theme
    input.addEventListener('change', () => {
        document.documentElement.dataset.theme = input.value
        if (input.value === 'system') localStorage.removeItem('theme')
        else localStorage.setItem('theme', input.value)
        drawCanvases()
    })
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => drawCanvases())

////////// THE RENDER SERVERS - how busy they are, on every page, and which ones a run may use
const servers = {list: [], chosen: undefined}
const chosenServers = () => servers.chosen

async function loadServers() {
    const response = await fetch('/api/servers').catch(() => undefined)
    if (!response?.ok) return
    servers.list = (await response.json()).servers
    $('servers').replaceChildren(...servers.list.map(server => el('span', {
        class: `server${!server.reachable ? ' down' : server.running || server.pending ? ' busy' : ''}`,
        title: server.reachable ? [server.device, server.freeGb !== undefined ? `${server.freeGb} of ${server.totalGb} GB free` : '', `${server.running} running, ${server.pending} waiting`].filter(Boolean).join(' · ') : 'Not reachable',
    }, el('i'), serverLabel(server))))
}
const serverLabel = server => !server.reachable ? `${server.name} down` : server.running || server.pending ? `${server.name} ${server.running}+${server.pending}` : server.name

function serverChoice() {
    let kept = []
    try {
        kept = JSON.parse(localStorage.getItem('servers') ?? '[]')
    } catch {}
    const up = servers.list.filter(server => server.reachable)
    const wanted = up.filter(server => kept.includes(server.name))
    const boxes = servers.list.map(server => ({server, box: el('input', {type: 'checkbox', disabled: !server.reachable, checked: server.reachable && (!wanted.length || wanted.includes(server))})}))
    const read = () => {
        const names = boxes.filter(({box}) => box.checked).map(({server}) => server.name)
        localStorage.setItem('servers', JSON.stringify(names))
        // none of them reachable: the run says so itself
        servers.chosen = names.length ? names : undefined
    }
    return {read, node: el('fieldset', {class: 'pick'}, el('legend', {}, 'Render on'), boxes.map(({server, box}) => el('label', {class: server.reachable ? '' : 'down'},
        box,
        el('span', {}, server.name),
        el('span', {class: 'muted num'}, !server.reachable ? 'not reachable' : [`${server.running} running, ${server.pending} waiting`, server.freeGb !== undefined ? `${server.freeGb} GB free` : ''].filter(Boolean).join(' · ')))))}
}

////////// ASKING - before anything that costs GPU time or moves a file
function ask({title, lines = [], warnings = [], confirm, danger = false, extra, render = false}) {
    const dialog = $('ask')
    const choice = render ? serverChoice() : undefined
    return new Promise(resolve => {
        const done = value => {
            if (value) choice?.read()
            dialog.close()
            resolve(value)
        }
        dialog.replaceChildren(
            el('h2', {}, title),
            ...lines.map(line => el('p', {class: 'muted'}, line)),
            ...warnings.map(line => el('div', {class: 'warn'}, line)),
            extra ?? '',
            choice?.node ?? '',
            el('div', {class: 'btn-row'},
                el('button', {class: 'btn', onclick: () => done(false)}, 'Cancel'),
                el('button', {class: `btn ${danger ? 'danger' : 'primary'}`, onclick: () => done(true)}, confirm)),
        )
        dialog.addEventListener('cancel', () => resolve(false), {once: true})
        dialog.showModal()
    })
}

function openViewer(picture, title, name, text, roots = {}) {
    $('viewer-img').src = mediaUrl(picture, roots.media)
    $('viewer-img').alt = name ?? title
    $('viewer-caption').replaceChildren(el('b', {}, [title.replace(/[<>]/g, ''), name].filter(Boolean).join(' · ')), text ? el('p', {}, text) : '')
    $('viewer').showModal()
}
$('viewer').addEventListener('click', event => { if (event.target === $('viewer')) $('viewer').close() })

////////// THE RUN - started here or in the terminal, it is followed from every page of the project
const run = {source: undefined, current: undefined, after: 0, onEnd: () => {}, wasRunning: false, action: undefined}

function renderRun(current) {
    run.current = current
    const dock = $('rundock')
    if (!current) { dock.hidden = true; return }
    const failed = !current.running && current.code !== undefined && current.code !== 0
    dock.hidden = false
    $('run-dot').className = `dot${current.running ? '' : failed ? ' failed' : ' done'}`
    $('run-state').textContent = current.running ? (current.source === 'terminal' ? 'Running in the terminal' : 'Running') : failed ? `Failed (${current.code})` : 'Finished'
    $('run-command').textContent = current.command
    $('run-stop').hidden = !current.running
    $('run-close').hidden = current.running
    followProgress(current.running)
}

function followRun(root) {
    run.source?.close()
    const source = new EventSource(`${root}/api/run-events?after=${run.after}`)
    run.source = source
    source.addEventListener('lines', event => {
        const {lines, next} = JSON.parse(event.data)
        run.after = next
        const log = $('run-log')
        const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 30
        log.append(lines.join('\n') + '\n')
        // what is far back goes: the log stays quick
        if (log.textContent.length > 400000) log.textContent = log.textContent.slice(-200000)
        if (atEnd) log.scrollTop = log.scrollHeight
    })
    source.addEventListener('state', event => {
        const current = JSON.parse(event.data)
        renderRun(current)
        if (current?.running) run.wasRunning = true
        else if (run.wasRunning) {
            run.wasRunning = false
            toast(!current ? 'The run has ended' : current.code ? 'The run failed - see the log' : 'The run is done', !!current?.code)
            if (current?.code) { $('run-log').hidden = false }
            run.onEnd(current)
        }
    })
}

async function startRun(action) {
    if (run.current?.running) throw new Error('a run is going on - wait for it, or stop it')
    const {run: started} = await api('run', {action, ...(servers.chosen ? {servers: servers.chosen} : {})})
    servers.chosen = undefined
    run.action = action
    run.wasRunning = true
    $('run-log').textContent = ''
    run.after = 0
    renderRun(started)
    followRun(base)
}

$('run-log-toggle').addEventListener('click', () => {
    $('run-log').hidden = !$('run-log').hidden
    if (!$('run-log').hidden) $('run-log').scrollTop = $('run-log').scrollHeight
})
$('run-stop').addEventListener('click', async () => {
    const yes = await ask({title: 'Stop this run?', lines: [run.current?.command ?? '', 'Finished outputs stay. Jobs already on a server are picked up by the next run.'], confirm: 'Stop', danger: true})
    if (yes) await api('stop', {}).catch(showError)
})
$('run-close').addEventListener('click', () => { $('rundock').hidden = true })

////////// THE START PAGE
const PAGE_SIZE = 24
// what a project's state counts as, for the filter: from what the list says, nothing is hashed for it
const STATES = {
    running: p => p.lastRun?.state === 'running',
    failed: p => p.lastRun?.state === 'failed' || p.lastRun?.state === 'stopped',
    unfinished: p => p.clips === 0 || p.rendered < p.clips || p.final !== 'current',
    done: p => p.clips > 0 && p.rendered === p.clips && p.final === 'current',
}

async function homePage() {
    show('view-list')
    document.title = 'Workspace'
    $('title').textContent = 'All projects'
    $('link-home').setAttribute('aria-current', 'page')
    const {projects} = await api('projects')
    const statuses = new Map()
    const expanded = new Set()
    // what is shown lives in the address: Back from a project lands in the same place, and a view can be linked
    const params = new URLSearchParams(location.search)
    const filter = {text: params.get('q') ?? '', kind: params.get('kind') ?? 'all', state: params.get('state') ?? 'all', page: Math.max(1, Number(params.get('page')) || 1)}
    const remember = (replace = false) => {
        const next = new URLSearchParams()
        if (filter.text) next.set('q', filter.text)
        if (filter.kind !== 'all') next.set('kind', filter.kind)
        if (filter.state !== 'all') next.set('state', filter.state)
        if (filter.page > 1) next.set('page', String(filter.page))
        const address = `/${next.size ? `?${next}` : ''}`
        if (replace) history.replaceState(null, '', address)
        else history.pushState(null, '', address)
    }
    const grid = el('div', {class: 'cards'})
    const pager = el('nav', {class: 'pager', 'aria-label': 'Pages'})
    const count = el('span', {class: 'muted num'})
    const search = el('input', {type: 'search', placeholder: 'Find a project', 'aria-label': 'Find a project', value: filter.text, oninput: () => {
        filter.text = search.value
        filter.page = 1
        remember(true)
        draw()
    }})
    const segment = (key, options) => {
        const seg = el('div', {class: 'seg'}, ...options.map(([value, label]) => el('button', {'aria-pressed': String(filter[key] === value), 'data-value': value, onclick: () => {
            filter[key] = value
            filter.page = 1
            remember()
            draw()
        }}, label)))
        return seg
    }
    const kinds = segment('kind', [['all', 'All'], ['music', 'Music videos'], ['film', 'Films']])
    const states = segment('state', [['all', 'Any state'], ['running', 'Running'], ['failed', 'Failed'], ['unfinished', 'Unfinished'], ['done', 'Done']])
    $('view-list').replaceChildren(el('div', {class: 'pagebar'}, el('h2', {}, 'Projects'), kinds, states, search, count), grid, pager)
    addEventListener('popstate', () => {
        const now = new URLSearchParams(location.search)
        filter.text = now.get('q') ?? ''
        filter.kind = now.get('kind') ?? 'all'
        filter.state = now.get('state') ?? 'all'
        filter.page = Math.max(1, Number(now.get('page')) || 1)
        search.value = filter.text
        draw()
    })

    const rootOf = p => `/p/${p.kind}/${encodeURIComponent(p.id)}`
    // what costs some hashing comes after the page is up, one project at a time, only for the cards of this page
    const queue = []
    let working = false
    const pump = async () => {
        if (working) return
        working = true
        while (queue.length) {
            const {project, fill} = queue.shift()
            try {
                const response = await fetch(`${rootOf(project)}/api/status`)
                if (response.ok) {
                    const status = await response.json()
                    statuses.set(`${project.kind}/${project.id}`, status)
                    fill(status)
                }
            } catch {}
        }
        working = false
    }
    const finalChip = {missing: ['No final video', 'chip'], current: ['Final video', 'chip good'], older: ['Final older than its clips', 'chip stale']}
    const runChip = {running: ['Running', 'chip good'], failed: ['Last run failed', 'chip bad'], stopped: ['Last run stopped', 'chip bad']}
    function card(project, others = []) {
        const stale = el('span', {class: 'row'})
        const next = el('span', {class: 'next'}, ' ')
        const fill = status => {
            stale.replaceChildren(
                status.clips.stale ? el('span', {class: 'chip stale'}, `${status.clips.stale} clips stale`) : '',
                status.pictures.stale ? el('span', {class: 'chip stale'}, `${status.pictures.stale} pictures stale`) : '',
            )
            next.textContent = status.next.command ? `Next: ${status.next.why}` : 'Everything is done'
            next.title = [status.next.command, status.next.estimate].filter(Boolean).join('\n')
        }
        const known = statuses.get(`${project.kind}/${project.id}`)
        if (known) fill(known)
        else queue.push({project, fill})
        const link = el('a', {class: 'card-link', href: `${rootOf(project)}/`},
            project.thumb ? el('img', {class: 'thumb', src: thumbUrl(project.thumb, 640, `${rootOf(project)}/thumb`), alt: '', loading: 'lazy', decoding: 'async'}) : el('span', {class: 'thumb'}),
            el('span', {class: 'body'},
                el('span', {class: 'name', title: project.id}, project.title),
                el('span', {class: 'muted num'}, `${project.rendered} of ${plural(project.clips, 'clip')} rendered`),
                el('span', {class: 'bar'}, el('i', {style: {width: `${project.clips ? project.rendered / project.clips * 100 : 0}%`}})),
                el('span', {class: 'row'},
                    el('span', {class: 'chip'}, project.kind === 'film' ? 'Film' : 'Music video'),
                    el('span', {class: finalChip[project.final][1]}, finalChip[project.final][0]),
                    runChip[project.lastRun?.state] && el('span', {class: runChip[project.lastRun.state][1], title: project.lastRun.command}, runChip[project.lastRun.state][0])),
                stale, next))
        return el('div', {class: 'card'}, link, others.length ? el('button', {class: 'more', 'aria-expanded': 'false', onclick: () => {
            expanded.add(project.group)
            draw()
        }}, `${plural(others.length, 'more take')}`) : '')
    }
    function draw() {
        for (const button of kinds.children) button.setAttribute('aria-pressed', String(button.dataset.value === filter.kind))
        for (const button of states.children) button.setAttribute('aria-pressed', String(button.dataset.value === filter.state))
        const text = filter.text.trim().toLowerCase()
        const hits = projects.filter(p => (filter.kind === 'all' || p.kind === filter.kind) && (filter.state === 'all' || STATES[filter.state]?.(p)) && (!text || p.id.toLowerCase().includes(text) || p.title.toLowerCase().includes(text)))
        // the takes of one thing fold into the newest: a search shows every hit by itself. The list comes newest first
        const entries = []
        const seen = new Map()
        for (const project of hits) {
            const group = seen.get(project.group)
            if (!text && group && !expanded.has(project.group)) group.others.push(project)
            else {
                const entry = {project, others: []}
                entries.push(entry)
                seen.set(project.group, entry)
            }
        }
        const pages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE))
        if (filter.page > pages) filter.page = pages
        const first = (filter.page - 1) * PAGE_SIZE
        const shown = entries.slice(first, first + PAGE_SIZE)
        count.textContent = hits.length === entries.length ? plural(hits.length, 'project') : `${plural(entries.length, 'group')} · ${plural(hits.length, 'project')}`
        queue.length = 0
        grid.replaceChildren(...shown.map(entry => card(entry.project, entry.others)))
        if (!shown.length) grid.replaceChildren(el('div', {class: 'empty'}, projects.length ? 'Nothing fits.' : 'No projects here yet - start one with: bun run init'))
        pump()
        const go = page => () => {
            filter.page = page
            remember()
            draw()
            $('view-list').scrollTop = 0
        }
        // the first, the last and those around this one; a long list does not need every number
        const numbers = [...new Set([1, filter.page - 1, filter.page, filter.page + 1, pages])].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b)
        pager.replaceChildren(...(pages > 1 ? [
            el('button', {class: 'btn', disabled: filter.page === 1, onclick: go(filter.page - 1)}, '‹ Newer'),
            ...numbers.flatMap((n, i) => [
                i && n - numbers[i - 1] > 1 ? el('span', {class: 'muted'}, '…') : '',
                el('button', {class: 'btn', 'aria-current': n === filter.page ? 'page' : false, onclick: go(n)}, String(n)),
            ]),
            el('button', {class: 'btn', disabled: filter.page === pages, onclick: go(filter.page + 1)}, 'Older ›'),
            el('span', {class: 'muted num'}, `${first + 1}-${first + shown.length} of ${entries.length}`),
        ] : []))
    }
    remember(true)
    draw()
}

        if (!shown.length) grid.replaceChildren(el('div', {class: 'empty'}, data.assets.length ? 'Nothing fits.' : 'The library is empty. Put an asset in from the References page of a project, or make one from a picture.'))
    }
    function detail() {
        const asset = selected
        if (!asset) return $('split-detail').replaceChildren(el('div', {class: 'empty'}, 'Pick an asset.'))
        $('split-detail').replaceChildren(
            asset.picture ? el('img', {src: thumbUrl(asset.picture, 640, libraryRoots.thumb), alt: asset.name, onclick: () => openViewer(asset.picture, asset.name, asset.id, asset.description, libraryRoots)}) : '',
            el('h2', {}, asset.name),
            el('p', {class: 'muted section'}, `${asset.kind === 'character' ? 'Character' : 'Place'} · ${asset.id}`),
            el('div', {class: 'section'}, el('h3', {}, 'Description'), el('p', {}, asset.description)),
            asset.anchors ? el('div', {class: 'section'}, el('h3', {}, 'Background features'), el('p', {}, asset.anchors)) : '',
            asset.video ? el('div', {class: 'section'}, el('h3', {}, 'Sequence'), el('video', {src: mediaUrl(asset.video, libraryRoots.media), controls: true, preload: 'metadata', style: {width: '100%'}})) : '',
            asset.frames.length ? el('div', {class: 'section'}, el('h3', {}, 'Views'), el('div', {class: 'strip'}, asset.frames.map((frame, n) => el('img', {src: thumbUrl(frame, 320, libraryRoots.thumb), alt: `View ${n + 1}`, loading: 'lazy', onclick: () => openViewer(frame, `View ${n + 1}`, asset.name, '', libraryRoots)})))) : '',
            el('div', {class: 'section'}, el('h3', {}, 'Used by'), asset.usedBy.length ? asset.usedBy.map(use => el('div', {}, el('a', {href: `/p/${use.kind}/${encodeURIComponent(use.id)}/casting`}, use.id), el('span', {class: 'muted'}, ` as ${use.role}`))) : el('p', {class: 'muted'}, 'No project plays this one yet. Choose it on the Casting page of a project.')),
            el('dl', {class: 'facts'}, asset.source ? [el('dt', {}, 'Comes from'), el('dd', {}, asset.source)] : '', asset.created ? [el('dt', {}, 'Made'), el('dd', {}, asset.created)] : ''),
        )
    }
    async function newAsset() {
        const kind = el('select', {}, el('option', {value: 'character'}, 'Character'), el('option', {value: 'location'}, 'Place'))
        const file = el('input', {type: 'file', accept: 'image/*', required: true})
        const id = el('input', {type: 'text', placeholder: 'kael-red'})
        const name = el('input', {type: 'text', placeholder: 'Optional'})
        const role = el('input', {type: 'text', placeholder: 'Optional, e.g. lead singer'})
        const description = el('textarea', {rows: 3, placeholder: 'Optional - without it a vision model describes the picture'})
        const field = (label, input) => el('label', {class: 'field'}, el('span', {}, label), input)
        const yes = await ask({
            title: 'New asset from a picture',
            lines: ['The picture becomes the anchor, ComfyUI renders the reference sheet from it. An asset already in the library is never overwritten.'],
            extra: el('div', {}, field('Picture', file), field('Kind', kind), field('Library id', id), field('Name', name), field('Role', role), field('Description', description)),
            confirm: 'Render it',
            render: true,
        })
        if (!yes) return
        const form = new FormData()
        form.set('anchor', file.files[0] ?? '')
        form.set('kind', kind.value)
        form.set('id', id.value.trim())
        form.set('name', name.value)
        form.set('role', role.value)
        form.set('description', description.value)
        if (servers.chosen) form.set('servers', JSON.stringify(servers.chosen))
        servers.chosen = undefined
        const response = await fetch('/api/library/create', {method: 'POST', body: form})
        const body = await response.json().catch(() => ({}))
        if (!response.ok) return showError(new Error(body.error ?? 'could not start'))
        run.wasRunning = true
        $('run-log').textContent = ''
        run.after = 0
        renderRun(body.run)
        followLibraryRun()
    }
    function followLibraryRun() {
        run.source?.close()
        run.source = new EventSource(`/api/library/run-events?after=0`)
        run.source.addEventListener('lines', event => {
            const {lines, next} = JSON.parse(event.data)
            run.after = next
            $('run-log').append(lines.join('\n') + '\n')
            $('run-log').scrollTop = $('run-log').scrollHeight
        })
        run.source.addEventListener('state', event => {
            const current = JSON.parse(event.data)
            renderRun(current)
            if (!current?.running && run.wasRunning) {
                run.wasRunning = false
                toast(current?.code ? 'Making the asset failed - see the log' : 'The asset is in the library', !!current?.code)
                if (current?.code) $('run-log').hidden = false
                api('library/assets').then(next => { data = next; draw(); detail() })
            }
        })
    }
    draw()
    detail()
    followLibraryRun()
}

function projectChrome(title) {
    $('title').textContent = title
    document.title = `${title} · Workspace`
    $('nav').replaceChildren(...[['timeline', 'Timeline', ''], ['references', 'References', 'references'], ['casting', 'Casting', 'casting']].map(([page, label, path]) =>
        el('a', {href: `${base}/${path}`, 'aria-current': route.page === page ? 'page' : false}, label)))
}

const FRESH_LABEL = {current: 'Current', stale: 'Stale', pinned: 'Pinned'}
// the words of the pipeline, where they appear and on the help page
const TERMS = {
    Current: 'Made from the request the plan has now.',
    Stale: 'Made from another prompt, picture or start frame than the plan has now. It still is a usable file: it is only rendered again when you ask.',
    Pinned: 'Your own file, an edited prompt, or made before these checks. The pipeline leaves it alone and does not compare it.',
    Anchor: 'The one picture a person or place starts from. The views of the sheet are drawn from it.',
    Sheet: 'The reference picture of a person or place: several views of it, made from a short video that starts on the anchor.',
    Approximate: 'A preview that starts on the last frame of the preview before it, not of the real clip. It shows the idea, not the exact start.',
    'Goes on': 'The clip starts on the last frame of the clip before. Rendering that one again leaves this one on a picture that is gone.',
    Take: 'Projects whose names differ only by a date or an ending, folded together on the start page.',
}

async function referencesPage() {
    show('view-split')
    const [{references}, project, fresh] = await Promise.all([api('references'), api('project'), api('freshness').catch(() => ({pictures: {}}))])
    projectChrome(project.title)
    let selected = references.find(r => r.id === location.hash.slice(1)) ?? references[0]
    const groups = [['character', 'Characters'], ['location', 'Places'], ['prop', 'Props']]
    const list = () => {
        $('split-list').replaceChildren(
            ...(references.length ? [] : [el('div', {class: 'empty'}, `No pictures planned yet - run ${project.command}`)]),
            ...groups.filter(([kind]) => references.some(r => r.kind === kind)).map(([kind, label]) => el('div', {class: 'section'}, el('div', {class: 'pagebar'}, el('h2', {}, label)), el('div', {class: 'cards'}, references.filter(r => r.kind === kind).map(reference => {
                const state = fresh.pictures[reference.id]
                return el('button', {class: `card${selected === reference ? ' selected' : ''}`, onclick: () => { selected = reference; history.replaceState(null, '', `#${reference.id}`); list(); detail() }},
                    reference.picture ? el('img', {class: 'thumb', src: thumbUrl(reference.picture, 640), alt: '', loading: 'lazy', decoding: 'async'}) : el('span', {class: 'thumb'}),
                    el('span', {class: 'body'},
                        el('span', {class: 'name'}, reference.name),
                        el('span', {class: 'muted'}, `${plural(reference.clips.length, 'clip')} use this`),
                        el('span', {class: 'row'},
                            !reference.picture ? el('span', {class: 'chip bad'}, 'Missing') : state === 'stale' ? el('span', {class: 'chip stale', title: TERMS.Stale}, 'Stale') : state === 'pinned' ? el('span', {class: 'chip', title: TERMS.Pinned}, 'Pinned') : '',
                            reference.library ? el('span', {class: 'chip'}, `library:${reference.library}`) : '',
                            reference.look ? el('span', {class: 'chip'}, 'Another look') : '',
                            reference.versions.length ? el('span', {class: 'chip'}, plural(reference.versions.length, 'older version')) : '')))
            })))),
        )
    }
    function detail() {
        const reference = selected
        if (!reference) return $('split-detail').replaceChildren(el('div', {class: 'empty'}, 'Nothing here yet.'))
        const state = fresh.pictures[reference.id]
        const blocked = !!reference.library || state === 'pinned'
        const prompt = el('textarea', {rows: 7, value: reference.prompt, 'aria-label': 'Prompt', disabled: reference.look ? true : undefined})
        const sideEffects = () => [
            reference.clips.length ? `${plural(reference.clips.length, 'clip')} made from this picture will go stale. They are not rendered on their own.` : '',
            reference.readsViews ? 'A new sheet changes what is read from it: the vision model reads the views again at the next run, and shots can get another view.' : '',
        ].filter(Boolean)
        const rerender = async newAnchor => {
            const edited = prompt.value.trim() !== reference.prompt.trim()
            const asked = await api('estimate', {pictures: 1}).catch(() => ({estimate: ''}))
            const yes = await ask({
                title: `Render ${reference.name} again?`,
                lines: [
                    newAnchor || edited ? 'A new anchor: another person or place from another seed, and everything after it is new.' : 'A new sheet from the same anchor: the same person or place, other views.',
                    asked.estimate,
                    edited ? 'The edited prompt is kept with this picture, which stays pinned: the plan never replaces it on its own. The prompt of the plan stays as it was.' : '',
                ].filter(Boolean),
                warnings: [
                    ...sideEffects(),
                    ...(newAnchor && reference.looks.length ? [`Its other looks are drawn from this anchor and go stale too: ${reference.looks.join(', ')}.`] : []),
                    ...(asked.fixedSeed !== undefined ? [`"seed" is fixed in config.json (${asked.fixedSeed}): the same seed gives the same picture again.`] : []),
                ],
                confirm: 'Render it',
                render: true,
            })
            if (!yes) return
            const {run: started} = await api(`references/${encodeURIComponent(reference.id)}/rerender`, {newAnchor, ...(edited ? {prompt: prompt.value} : {}), ...(servers.chosen ? {servers: servers.chosen} : {})})
            servers.chosen = undefined
            run.wasRunning = true
            $('run-log').textContent = ''
            run.after = 0
            renderRun(started)
            followRun(base)
        }
        const pick = async version => {
            const yes = await ask({title: 'Make this version the current one?', lines: ['What is there now is put away and stays selectable.'], warnings: sideEffects(), confirm: 'Make it current'})
            if (!yes) return
            await api(`references/${encodeURIComponent(reference.id)}/pick`, {version: version.id})
            location.reload()
        }
        const exportable = reference.kind !== 'prop' && reference.picture
        const putIntoLibrary = async () => {
            const as = el('input', {type: 'text', value: reference.id})
            const yes = await ask({title: `Put ${reference.name} into the library?`, lines: ['Its picture, its whole sheet and its texts are copied. An asset the library already has is never overwritten.'], extra: el('label', {class: 'field'}, el('span', {}, 'Library id'), as), confirm: 'Put it in'})
            if (yes) await startRun({type: 'export-asset', asset: reference.id, as: as.value.trim()}).catch(showError)
        }
        $('split-detail').replaceChildren(
            reference.picture ? el('img', {src: thumbUrl(reference.picture, 640), alt: reference.name, onclick: () => openViewer(reference.picture, reference.name, reference.id, reference.description)}) : el('div', {class: 'empty'}, 'Not rendered yet'),
            el('h2', {}, reference.name),
            el('p', {class: 'muted section'}, `${reference.kind} · ${reference.id}${state ? ` · ${FRESH_LABEL[state]}` : ''}`),
            reference.look ? el('div', {class: 'note'}, `Another look of ${reference.look.base}: ${reference.look.change}`) : '',
            reference.library ? el('div', {class: 'note'}, `Played by library:${reference.library}. It is not rendered here: change it on the `, el('a', {href: `${base}/casting`}, 'Casting'), ' page.') : '',
            state === 'pinned' && !reference.library ? el('div', {class: 'note'}, 'Pinned: your own picture, or one made before fingerprints or from an edited prompt. The pipeline leaves it alone.') : '',
            state === 'stale' ? el('div', {class: 'warn'}, 'Made from another prompt or anchor than the plan has now.') : '',
            el('div', {class: 'section'}, el('h3', {}, 'Prompt'), prompt),
            el('div', {class: 'section btn-row'},
                el('button', {class: 'btn primary', disabled: blocked, title: blocked ? 'Pinned or played by the library' : '', onclick: () => rerender(false).catch(showError)}, reference.hasSheet ? 'New sheet, same anchor' : 'Render again'),
                reference.hasSheet && !reference.look ? el('button', {class: 'btn', title: TERMS.Anchor, disabled: blocked, onclick: () => rerender(true).catch(showError)}, 'New anchor') : '',
                exportable ? el('button', {class: 'btn', onclick: putIntoLibrary}, 'Put into the library') : ''),
            reference.video ? el('div', {class: 'section'}, el('h3', {}, 'Sequence'), el('video', {src: mediaUrl(reference.video), controls: true, preload: 'metadata', style: {width: '100%'}})) : '',
            reference.frames.length ? el('div', {class: 'section'}, el('h3', {}, 'Views'), el('div', {class: 'strip'}, reference.frames.map((frame, n) => el('img', {src: thumbUrl(frame), alt: `View ${n + 1}`, loading: 'lazy', onclick: () => openViewer(frame, `View ${n + 1}`, reference.name)})))) : '',
            el('div', {class: 'section'}, el('h3', {}, `Used by ${plural(reference.clips.length, 'clip')}`), el('div', {class: 'btn-row'}, reference.clips.map(clip => el('a', {class: 'chip', href: `${base}/#${clip}`}, clip)))),
            reference.versions.length ? el('div', {class: 'section'}, el('h3', {}, 'Older versions'), reference.versions.map(version => el('article', {class: 'version'},
                el('img', {src: thumbUrl(version.picture), alt: '', loading: 'lazy', onclick: () => openViewer(version.picture, 'Older version', reference.name, version.prompt), style: {cursor: 'zoom-in'}}),
                el('div', {},
                    el('div', {}, dateOf(version.made)),
                    el('div', {class: 'muted'}, [{again: 'rendered again', stale: 'from an older plan', library: 'before the library took over'}[version.source], version.seed !== undefined ? `seed ${version.seed}` : ''].filter(Boolean).join(' · ')),
                    el('div', {class: 'btn-row'}, el('button', {class: 'btn', disabled: !!reference.library, onclick: () => pick(version).catch(showError)}, 'Make current')))))) : '',
        )
    }
    list()
    detail()
    run.onEnd = () => location.reload()
    followRun(base)
}

async function castingPage() {
    show('view-list')
    const [casting, project] = await Promise.all([api('casting'), api('project')])
    projectChrome(project.title)
    let changed = false
    const role = member => {
        const options = casting.options[member.kind]
        const select = el('select', {'aria-label': `Who plays ${member.name}`, onchange: () => choose(member, select)},
            el('option', {value: `project:${member.id}`}, 'Rendered in this project'),
            options.map(id => el('option', {value: `library:${id}`}, `library: ${id}`)))
        select.value = member.entry ?? `project:${member.id}`
        if (member.entry && select.value !== member.entry) select.append(el('option', {value: member.entry, selected: true}, member.entry))
        return el('article', {class: 'role'},
            member.picture ? el('img', {src: thumbUrl(member.picture), alt: '', onclick: () => openViewer(member.picture, member.name, member.id), style: {cursor: 'zoom-in'}}) : el('span', {class: 'noimg'}),
            el('div', {},
                el('b', {}, member.name), el('span', {class: 'muted'}, ` ${member.id}`),
                el('div', {class: 'muted'}, [member.kind === 'character' ? (member.role || 'Character') : 'Place', plural(member.clips.length, 'clip')].join(' · ')),
                member.libraryId && !member.copied ? el('div', {class: 'warn'}, 'Not copied yet: the next run takes it from the library.') : '',
                member.errors.map(line => el('div', {class: 'warn bad'}, line)),
                member.warnings.map(line => el('div', {class: 'warn'}, line))),
            select)
    }
    async function choose(member, select) {
        const value = select.value
        const was = member.entry ?? `project:${member.id}`
        const asked = member.clips.length ? await api('estimate', {clips: member.clips}).catch(() => ({})) : {}
        const yes = await ask({
            title: `${member.name}: ${value}?`,
            lines: [
                'This changes one entry in casting.json. The next plan run copies the asset, pins it and takes its description.',
                asked.estimate ? `Rendering the clips again: ${asked.estimate}` : '',
            ].filter(Boolean),
            warnings: member.clips.length ? [`Their prompts change with the description, so ${plural(member.clips.length, 'clip')} go stale: ${member.clips.join(', ')}. Nothing is rendered on its own.`] : [],
            confirm: 'Change it',
        })
        if (!yes) { select.value = was; return }
        try {
            await api('casting', {kind: member.kind, id: member.id, value})
            member.entry = value
            changed = true
            draw()
            toast('casting.json is changed')
        } catch (error) {
            select.value = was
            showError(error)
        }
    }
    function draw() {

            casting.errors.map(line => el('div', {class: 'warn bad'}, line)),

////////// THE TIMELINE: STATE
const state = {
    project: undefined,
    projectText: '',
    fresh: {clips: {}, pictures: {}},
    peaks: undefined,
    t: 0,
    playing: false,
    clip: undefined,        // the clip at the playhead - what the monitor and the inspector show
    tab: 'prompt',
    pps: 1,                 // pixels per second of the timeline
    fitted: true,
    muted: false,

const song = $('song')

const stateOf = clip => !clip.video ? 'missing' : state.fresh.clips[clip.id] ?? 'unknown'

const clipAt = t => state.project.clips.find(c => t >= c.start && t < c.end)
// A final video newer than all its clips is those clips, cut and with their sound in one file: nothing can run apart in it. Only without
// one do the clips play one by one, and a song in an element of its own under them stays some hundredths of a second off.
const chosenFinal = () => state.source.startsWith('final:') ? state.project?.finals.find(f => f.file === state.source.slice('final:'.length)) : undefined
const playsFinal = () => !!chosenFinal()
const usesSong = () => !!state.project?.song && !playsFinal()
const sizeOf = item => item.width ? `${item.width}×${item.height}` : ''
const fpsOf = item => item.fps ? `${Math.round(item.fps * 100) / 100} fps` : ''
// what a clip plays from: previews asked for, or nothing else there - marked on the monitor
const fileOf = clip => state.source === 'previews' ? clip.preview ?? clip.video : clip.video ?? clip.preview

const setSrc = (node, url) => { if (node.dataset.url !== url) { node.dataset.url = url; node.src = url } }

const sourceKey = () => `source:${route.kind}/${route.id}`
function renderSourceChoice() {
    const select = $('source')

    const clipsLabel = song ? 'Clips over the song' : 'Clips'
    const options = [
        ...finals.map(final => [`final:${final.file}`, [final.label, sizeOf(final), final.state === 'older' ? 'older than its clips' : ''].filter(Boolean).join(' · ')]),
        ['clips', clipsLabel],

    const known = value => options.some(([option]) => option === value)
    // a choice by hand stays, here and at the next visit, as long as it is there
    const kept = localStorage.getItem(sourceKey())
    if (!state.sourceChosen && kept && known(kept)) {
        state.source = kept
        state.sourceChosen = true
    }
    if (!state.sourceChosen || !known(state.source)) {

        const best = finals.find(f => !f.preview && f.state === 'current')

}
// what the monitor shows right now: read from the video itself, not from a plan
function renderPlayingInfo() {
    const info = $('playing')
    const node = video()
    const final = chosenFinal()
    const clip = state.clip
    const file = !final && clip ? fileOf(clip) : undefined
    const preview = !!file && file === clip?.preview
    if (node.hidden || (!final && !file)) { info.hidden = true; return }
    const size = node.videoWidth ? `${node.videoWidth}×${node.videoHeight}` : final ? sizeOf(final) : clip?.video?.size?.replace('x', '×') ?? ''
    const fps = final ? fpsOf(final) : `${state.project.fps} fps`

    info.title = final ? final.file : [file?.file, preview ? 'a preview' : clip?.video?.workflow, clip?.video?.seed !== undefined && !preview ? `seed ${clip.video.seed}` : ''].filter(Boolean).join(' · ')

for (const node of [$('video-a'), $('video-b')]) node.addEventListener('loadedmetadata', () => renderPlayingInfo())
$('source').addEventListener('change', () => {

function showClip(clip, offset) {
    const notice = $('notice')
    const poster = $('poster')
    const flag = $('preview-flag')
    notice.hidden = true
    poster.hidden = true
    flag.hidden = true
    if (playsFinal()) {

        video().hidden = false

        song.pause()

        video().playbackRate = state.speed
        if (state.playing) video().play().catch(() => {})
        renderPlayingInfo()
        return
    }
    const file = clip && fileOf(clip)
    if (!file) {
        for (const node of videos) { node.hidden = true; node.pause() }
        renderPlayingInfo()
        notice.hidden = false
        notice.textContent = clip ? 'Not rendered' : state.project.clips.length ? 'No clip here' : 'No clips planned yet'
        const stand = clip?.pictures.find(p => p.kind === 'location' && p.exists) ?? clip?.pictures.find(p => p.exists)

    if (state.playing) video().play().catch(() => {})

    const following = state.project.clips[state.project.clips.indexOf(clip) + 1]
    const nextFile = following && fileOf(following)

}

function applySound() {

}

function setClip(clip) {

function renderNow() {

}

function moveTo(t, {scroll = true} = {}) {

function seek(t) {
    const target = clamp(t, 0, state.project.seconds)

function setPlaying(playing) {
    state.playing = playing
    $('play-icon').setAttribute('d', playing ? 'M7 4h3.5v16H7zM13.5 4H17v16h-3.5z' : 'M7 4v16l13-8z')
    $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play')
    if (playing) {

        lastTick = performance.now()
        if (usesSong()) song.play().catch(() => setPlaying(false))
        if (playsFinal() || (clipAt(state.t) && fileOf(clipAt(state.t)))) video().play().catch(() => {})
        requestAnimationFrame(tick)
    } else {

    }
}

let lastTick = 0
function tick(now) {
    if (!state.playing) return
    const elapsed = (now - lastTick) / 1000
    lastTick = now
    const clip = state.clip && state.t >= state.clip.start && state.t < state.clip.end ? state.clip : clipAt(state.t)
    let t
    if (playsFinal()) t = video().ended ? state.project.seconds : video().currentTime
    else if (usesSong()) t = song.ended ? state.project.seconds : song.currentTime
    else if (clip && fileOf(clip) && !video().hidden) t = video().ended ? clip.end : clip.start + video().currentTime
    else t = state.t + elapsed      // nothing plays here: the time goes on by the clock, as it does in the final video

    if (state.loop && t >= state.loop.to) {
        seek(state.loop.from)
        if (usesSong() && song.paused) song.play().catch(() => {})
        if (video().paused && !video().hidden) video().play().catch(() => {})
        requestAnimationFrame(tick)
        return
    }
    if (t >= state.project.seconds) {
        moveTo(state.project.seconds)
        setPlaying(false)
        return
    }
    const here = clipAt(t)
    if (here !== state.clip) {
        moveTo(t)
        setClip(here)
        showClip(here, here ? t - here.start : 0)
    } else {
        moveTo(t)
        if (usesSong() && here && fileOf(here)) followSong(t - here.start)
    }
    requestAnimationFrame(tick)
}

// Under the song a clip follows it. A jump would show, so more than a frame off is played away a little faster or slower; only what has
// grown large (a clip still loading) is a jump. Less than a frame is left alone: every change of the rate disturbs the video's clock.
const JUMP_AT = 0.2
const A_FRAME = 1 / 24
const MOST_RATE_CHANGE = 0.1
function followSong(wanted) {
    const late = wanted - video().currentTime
    if (Math.abs(late) > JUMP_AT) {
        video().currentTime = wanted
        return setRate(1)
    }
    setRate(Math.abs(late) < A_FRAME ? 1 : 1 + clamp(late, -MOST_RATE_CHANGE, MOST_RATE_CHANGE))
}
const setRate = rate => { if (Math.abs(video().playbackRate - rate * state.speed) > 0.004) video().playbackRate = rate * state.speed }

////////// JUDGING A CLIP: speed, single frames, a loop
const SPEEDS = [0.25, 0.5, 1, 1.5, 2]
function setSpeed(speed) {
