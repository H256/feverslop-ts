    $('speed').textContent = `${speed}×`
}
const changeSpeed = direction => setSpeed(SPEEDS[clamp(SPEEDS.indexOf(state.speed) + direction, 0, SPEEDS.length - 1)])

function stepFrame(direction) {
    if (state.playing) setPlaying(false)
    seek(state.t + direction / state.project.fps)
}

function setLoop(loop) {

}
function toggleLoop(shotOnly) {

    const inClip = state.t - clip.start
    const index = clip.shots.findLastIndex(shot => shot.at <= inClip)
    const shot = clip.shots[Math.max(0, index)]

////////// A LARGER LOOK: over a clip on the timeline, over a <Picture N> in a prompt
let peekSeek = 0
function placePeek(event, above) {
    const peek = $('peek')
    peek.style.left = `${clamp(event.clientX - 160, 8, innerWidth - 328)}px`
    peek.style.top = `${clamp(above - peek.offsetHeight - 8, 8, innerHeight - peek.offsetHeight - 8)}px`
}
function peekClip(event, clip) {
    const peek = $('peek')
    const box = event.target.closest('.clip').getBoundingClientRect()
    const fraction = clamp((event.clientX - box.left) / box.width, 0, 0.999)
    const at = (clip.end - clip.start) * fraction
    let node = peek.querySelector('video')
    if (peek.dataset.clip !== clip.id) {
        peek.dataset.clip = clip.id
        const stand = clip.firstFrame ?? clip.pictures.find(p => p.exists)
        node = clip.video ? el('video', {src: mediaUrl(clip.video), muted: true, preload: 'auto', poster: stand ? thumbUrl(stand, 640) : undefined}) : undefined
        peek.replaceChildren(node ?? (stand ? el('img', {src: thumbUrl(stand, 640), alt: ''}) : ''), el('div', {class: 'num'}))
    }
    peek.querySelector('div').textContent = `${clip.id} · ${clock(clip.start + at)}${clip.video ? '' : ' · not rendered'}`
    // a video only follows so fast: the newest place wins
    if (node && performance.now() - peekSeek > 90) {
        peekSeek = performance.now()
        node.currentTime = at
    }
    peek.hidden = false
    placePeek(event, box.top)
}

    peek.replaceChildren(el('img', {src: thumbUrl(picture, 640), alt: ''}), el('div', {}, picture.name || picture.label))
    peek.hidden = false
    placePeek(event, event.target.getBoundingClientRect().top)
}

    $('peek').dataset.clip = ''
    $('peek').replaceChildren()
}
$('clips').addEventListener('pointermove', event => {

})

////////// MARKING SEVERAL CLIPS
function clickClip(event, clip) {
    if (event.ctrlKey || event.metaKey) {
        if (state.marked.has(clip.id)) state.marked.delete(clip.id)
        else state.marked.add(clip.id)
        state.lastMarked = clip.id
    } else if (event.shiftKey) {
        const clips = state.project.clips
        const from = clips.findIndex(c => c.id === (state.lastMarked ?? state.clip?.id))
        const to = clips.indexOf(clip)
        for (const c of clips.slice(Math.min(from < 0 ? to : from, to), Math.max(from < 0 ? to : from, to) + 1)) state.marked.add(c.id)
        state.lastMarked = clip.id

}
function showMarks() {
    for (const node of $('clips').children) {

async function renderMarked() {

    const asked = await api('estimate', {clips: clips.map(c => c.id)}).catch(() => ({risks: []}))
    const later = [...new Set(clips.flatMap(chain))].filter(id => !state.marked.has(id))
    const yes = await ask({
        title: `Render ${plural(clips.length, 'clip')}${clips.some(c => c.video) ? ' again' : ''}?`,
        lines: [clips.map(c => c.id).join(', '), clips.some(c => c.video) ? 'A new seed each. What is there now is put away and stays selectable.' : '', asked.estimate].filter(Boolean),
        warnings: [
            ...(asked.risks ?? []),
            ...(asked.fixedSeed !== undefined ? [`"seed" is fixed in config.json (${asked.fixedSeed}): the same seed gives the same clips again.`] : []),
            ...(later.length ? [`${later.join(', ')} go on from these clips. They go stale and are not rendered on their own.`] : []),
        ],
        confirm: 'Render them',

    })

    await startRun({type: 'clips', ids: clips.map(c => c.id), again: clips.some(c => c.video)})

}

////////// A RUN, ON THE BLOCKS OF THE TIMELINE
let progressTimer
const PROGRESS_LABEL = {waiting: 'waiting', rendering: 'rendering', done: 'done'}
function followProgress(running) {
    if (route.page !== 'timeline' || route.view !== 'project') return
    if (running && !progressTimer) {
        pollProgress()
        progressTimer = setInterval(pollProgress, 2000)
    } else if (!running && progressTimer) {
        clearInterval(progressTimer)
        progressTimer = undefined
        showProgress({clips: {}, done: 0, total: 0})
    }
}
async function pollProgress() {
    const response = await fetch(`${base}/api/progress`).catch(() => undefined)
    if (!response?.ok) return
    const {progress} = await response.json()
    showProgress(progress ?? {clips: {}, done: 0, total: 0})
}
function showProgress({clips, done, total}) {
    for (const node of $('clips').children) {
        const now = clips[node.dataset.id]
        node.classList.remove('p-waiting', 'p-rendering', 'p-done')
        node.querySelector('.progress')?.remove()
        if (!now) continue
        node.classList.add(`p-${now}`)
        node.append(el('span', {class: 'progress'}, PROGRESS_LABEL[now]))
    }
    if (total && run.current?.running) $('run-state').textContent = `${run.current.source === 'terminal' ? 'Running in the terminal' : 'Running'}: ${done} of ${plural(total, 'clip')} done`
}

////////// GOING THROUGH CLIPS
function startReview(clips) {
    if (!clips.length) return
    state.review = {clips, index: 0, source: state.source, chosen: state.sourceChosen, again: new Set()}
    // a final video would show the clips as they were when it was made
    state.source = 'clips'
    state.sourceChosen = true
    renderSourceChoice()
    reviewShow()
}
function reviewShow() {
    const review = state.review
    const clip = review.clips[review.index]
    setLoop({from: clip.start, to: clip.end, label: clip.id})
    seek(clip.start)
    setPlaying(true)
    const bar = $('reviewbar')
    bar.hidden = false
    bar.replaceChildren(
        el('b', {}, clip.id), el('span', {class: 'num'}, `${review.index + 1} of ${review.clips.length}`),
        el('span', {}, el('kbd', {}, 'Enter'), ' fine'), el('span', {}, el('kbd', {}, 'R'), ' render again'), el('span', {}, el('kbd', {}, 'C'), ' compare'), el('span', {}, el('kbd', {}, 'Esc'), ' end'),
        review.again.size ? el('span', {}, `${review.again.size} to render`) : '',
    )
}
function reviewStep(direction) {
    const review = state.review
    const next = review.index + direction
    if (next < 0) return
    if (next >= review.clips.length) return endReview()
    review.index = next
    reviewShow()
}
function endReview() {
    const review = state.review
    if (!review) return
    state.review = undefined
    $('reviewbar').hidden = true
    setLoop(undefined)
    setPlaying(false)
    state.source = review.source
    state.sourceChosen = review.chosen
    renderSourceChoice()
    showClip(state.clip, state.clip ? state.t - state.clip.start : 0)
    // what was gone through is decided: what stays marked is what is to be rendered
    for (const clip of review.clips) state.marked.delete(clip.id)
    for (const id of review.again) state.marked.add(id)
    showMarks()
    if (!review.again.size) return toast('Review done')
    renderMarked().catch(showError)
}
async function reviewCompare() {
    const clip = state.review.clips[state.review.index]
    const {versions} = await api(`versions/${clip.id}`)
    if (!versions.length || !clip.video) return toast(`${clip.id} has no older version`)
    setPlaying(false)
    compare(clip, versions[0])
}
// what the keys do while a review goes on: true when the key was its own
function reviewKey(event) {
    if (!state.review) return false
    const clip = state.review.clips[state.review.index]
    const actions = {
        Enter: () => reviewStep(1),
        ArrowRight: () => reviewStep(1),
        ArrowLeft: () => reviewStep(-1),
        r: () => { state.review.again.add(clip.id); reviewStep(1) },
        c: () => reviewCompare().catch(showError),
        Escape: () => endReview(),
    }
    const action = actions[event.key]
    if (!action) return false
    event.preventDefault()
    action()
    return true
}
function reviewList() {
    const clips = state.project.clips.filter(c => c.video)
    const marked = clips.filter(c => state.marked.has(c.id))
    if (marked.length) return marked
    const flaggedOnes = clips.filter(flagged)
    return flaggedOnes.length ? flaggedOnes : clips
}

// after a render of clips that were there before: see what came out against what was there
async function afterRender(current) {
    const action = run.action
    run.action = undefined
    if (current?.code || action?.type !== 'clips' || !action.again || action.preview) return
    const clips = state.project.clips.filter(c => action.ids.includes(c.id) && c.video)
    if (clips.length !== 1) return startReview(clips)
    const {versions} = await api(`versions/${clips[0].id}`)
    if (versions.length) compare(clips[0], versions[0], {fresh: true})
}

function step(direction) {
    const clips = state.project.clips
    if (!clips.length) return
    const index = state.clip ? clips.indexOf(state.clip) : clips.findIndex(c => c.start > state.t) - (direction > 0 ? 1 : 0)
    // back: first to the start of this clip, from there to the one before
    const target = direction < 0 && state.clip && state.t - state.clip.start > 0.5 ? index : clamp(index + direction, 0, clips.length - 1)
    seek(clips[target].start)
}

function stepFlagged(direction) {
    const clips = state.project.clips.filter(flagged)
    if (!clips.length) return
    const next = direction > 0 ? clips.find(c => c.start > state.t + 0.01) ?? clips[0] : clips.findLast(c => c.start < state.t - 0.01) ?? clips.at(-1)
    seek(next.start)
}

////////// INSPECTOR
const TABS = [
    ['prompt', 'Prompt', () => undefined],
    ['shots', 'Shots', clip => clip.shots.length],
    ['refs', 'References', clip => clip.pictures.length + clip.audio.length],
    ['render', 'Render', () => undefined],
    ['versions', 'Versions', () => state.versions?.clip === state.clip?.id ? state.versions.list.length || undefined : undefined],
]
const STATE_CHIPS = {
    missing: ['Not rendered', 'chip'],
    stale: ['Stale', 'chip stale', TERMS.Stale],
    current: ['Current', 'chip good', TERMS.Current],
    pinned: ['Pinned', 'chip', TERMS.Pinned],
    unknown: ['Checking…', 'chip'],
}

function renderInspector() {
    const clip = state.clip
    $('ihead').replaceChildren(...(clip ? [
        el('h2', {}, clip.id, el('span', {class: STATE_CHIPS[stateOf(clip)][1], title: STATE_CHIPS[stateOf(clip)][2], style: {'font-family': 'var(--sans)', 'font-weight': '400'}}, STATE_CHIPS[stateOf(clip)][0])),
        el('p', {class: 'num'}, `${clock(clip.start)} – ${clock(clip.end)} · ${(clip.end - clip.start).toFixed(1)}s · ${state.project.groups.find(g => g.id === clip.group)?.label ?? clip.group}`),
        ...clip.marks.map(mark => el('div', {class: `warn${mark.kind === 'failed' || mark.kind === 'backdrop' ? ' bad' : ''}`}, mark.text)),
    ] : [el('h2', {}, 'No clip'), el('p', {}, 'Nothing at the playhead')]))
    $('tabs').replaceChildren(...(clip ? TABS : []).map(([id, name, count]) => {
        const n = count(clip)
        return el('button', {role: 'tab', 'aria-selected': String(state.tab === id), onclick: () => { state.tab = id; renderInspector(); $('panel').scrollTop = 0 }}, name, n ? el('small', {}, String(n)) : undefined)
    }))
    if (!clip) return $('panel').replaceChildren(el('div', {class: 'empty'}, state.project.clips.length ? 'Pick a clip on the timeline.' : `No plan yet - run ${state.project.command}`))
    const panels = {prompt: promptPanel, shots: shotsPanel, refs: refsPanel, render: renderPanel, versions: versionsPanel}
    $('panel').replaceChildren(...panels[state.tab](clip))
}

function promptPanel(clip) {
    // <Picture N> and <Audio N> are the prompt's own markup: they point at the references of the clip
    const parts = clip.prompt.split(/(<(?:Picture|Audio) \d+>)/g).map(part => {
        if (!/^<(Picture|Audio) \d+>$/.test(part)) return part
        const label = part.slice(1, -1)
        const ref = clip.pictures.find(p => p.label === part || p.label === label) ?? clip.audio.find(a => a.label === part || a.label === label)
        const picture = clip.pictures.find(p => (p.label === part || p.label === label) && p.exists)
        return el('span', {class: 'token', title: picture ? '' : ref ? (ref.name ?? ref.stem ?? '') : '', onpointerenter: picture ? event => peekPicture(event, picture) : undefined, onpointerleave: picture ? hidePeek : undefined}, part)
    })
    return [el('div', {class: 'prompt'}, parts)]
}

function shotsPanel(clip) {
    const out = []
    if (clip.context.text || clip.context.staging) {
        out.push(el('div', {class: 'section'},
            el('h3', {}, clip.context.label),
            clip.context.text && el('p', {}, clip.context.text),
            clip.context.staging && el('p', {class: 'muted', style: {'margin-top': '4px'}}, clip.context.staging)))
    }
    out.push(el('div', {class: 'section'}, el('h3', {}, 'Shots'), clip.shots.map(shot => el('article', {class: 'shot'},
        el('header', {}, el('span', {}, shot.label.replace(/^\[|\]$/g, '')), el('span', {class: 'num'}, `${shot.at}s`)),
        el('p', {class: 'how'}, [shot.framing, shot.camera].filter(Boolean).join(' · ')),
        shot.action && el('p', {}, shot.action),
        shot.people.map(person => el('div', {class: 'person'}, el('b', {}, person.name), ` ${person.text}`)),
    ))))
    if (clip.lines.length) {

            el('time', {}, `${line.at.toFixed(1)}s`),
            el('div', {}, line.text, line.who && el('small', {}, line.who))))))
    }
    return out
}

const pictureState = file => {
    const job = state.project.pictures.find(p => p.file === file)
    return job ? state.fresh.pictures[job.id] : undefined
}

function refsPanel(clip) {
    const out = []
    const why = picture => picture.kind === 'location' ? (clip.views?.chosen ? `view ${clip.views.chosen}: ${clip.views.options[clip.views.chosen - 1].name}` : 'the place') : picture.kind === 'frame' ? 'the frame it goes on from' : picture.kind
    out.push(el('div', {class: 'section'}, el('h3', {}, 'Pictures'), el('div', {class: 'refs'}, clip.pictures.map(picture => {
        const fresh = pictureState(picture.file)
        return el('button', {class: 'ref', title: picture.description, onclick: () => picture.exists && openViewer(picture, picture.label, picture.name, picture.description)},
            picture.exists ? el('img', {src: thumbUrl(picture, 640), alt: picture.name, loading: 'lazy', decoding: 'async'}) : el('span', {class: 'noimg'}, 'Missing'),
            el('div', {}, el('b', {}, picture.name || picture.label), el('small', {}, picture.label.replace(/[<>]/g, ''), ' · ', why(picture), fresh === 'stale' && el('span', {class: 'stale', title: TERMS.Stale}, 'stale'), fresh === 'pinned' && el('span', {title: TERMS.Pinned}, 'pinned'))))
    }))))
    if (clip.audio.length) {

            el('dt', {}, audio.label.replace(/[<>]/g, '')),
            el('dd', {class: 'num'}, `${audio.stem ?? ''} · ${audio.songStart.toFixed(1)}s – ${audio.songEnd.toFixed(1)}s of the song`),
        ]))))
    }
    if (state.project.kind === 'film') out.push(...overridePanel(clip))
    return out
}

// a film clip's own choice of its place's view and its references: kept in a small file, the plan is not touched
function overridePanel(clip) {
    const override = {placeView: clip.override?.placeView, without: [...(clip.override?.without ?? [])], order: [...(clip.override?.order ?? [])]}
    const save = async next => {
        await api(`override/${clip.id}`, next)
        await loadProject()
        toast('Kept for this clip. It takes effect with the next plan run, and the clip then goes stale.')
    }
    const planButton = el('button', {class: 'btn', onclick: () => startRun({type: 'plan'}).catch(showError)}, 'Plan now')
    const out = []
    if (clip.views?.options.length) {
        const chosen = override.placeView ?? clip.views.chosen
        out.push(el('div', {class: 'section'}, el('h3', {}, 'View of the place'), el('div', {class: 'refs'}, clip.views.options.map(option => el('button', {class: `ref${option.n === chosen ? ' chosen' : ''}`, title: option.shows, onclick: () => save({...override, placeView: option.n}).catch(showError)},
            option.v ? el('img', {src: thumbUrl(option), alt: '', loading: 'lazy'}) : el('span', {class: 'noimg'}, 'Not rendered'),
            el('div', {}, el('b', {}, option.name), el('small', {}, `View ${option.n}${option.n === clip.views.chosen ? ' · in the plan' : ''}`)))))))
    }
    if (clip.views) {
        const addView = async () => {
            const name = el('input', {type: 'text', placeholder: 'behind the bar, looking at the door'})
            const shows = el('textarea', {rows: 3, placeholder: 'What is seen from there'})
            const field = (label, input) => el('label', {class: 'field'}, el('span', {}, label), input)
            const yes = await ask({title: 'One more view of this place', lines: ['For where the sheet has no view that fits. Rendered from the anchor of the place, so the look stays the same. It appears here to choose from.'], extra: el('div', {}, field('Where the camera is', name), field('What it shows', shows)), confirm: 'Render it', render: true})
            if (yes) await startRun({type: 'add-view', location: clip.views.locationId, name: name.value, shows: shows.value})
        }
        out.push(el('div', {class: 'section'}, el('button', {class: 'btn', onclick: () => addView().catch(showError)}, 'Add a view of this place')))
    }
    const people = clip.pictures.filter(p => p.kind !== 'frame')
    if (people.length > 1) {
        const move = (picture, direction) => {
            const order = people.map(p => p.id)
            const at = order.indexOf(picture.id)
            order.splice(at, 1)
            order.splice(clamp(at + direction, 0, order.length), 0, picture.id)
            save({...override, order}).catch(showError)
        }
        out.push(el('div', {class: 'section'}, el('h3', {}, 'References and their order'), people.map((picture, n) => el('div', {class: 'btn-row', style: {'margin-bottom': '4px'}},
            el('span', {style: {flex: 1}}, `${n + 1}. ${picture.name}`),
            el('button', {class: 'btn', disabled: n === 0, 'aria-label': `${picture.name} up`, onclick: () => move(picture, -1)}, '↑'),
            el('button', {class: 'btn', disabled: n === people.length - 1, 'aria-label': `${picture.name} down`, onclick: () => move(picture, 1)}, '↓'),
            el('button', {class: 'btn', onclick: () => save({...override, without: [...override.without, picture.id]}).catch(showError)}, 'Leave out')))))
    }
    if (override.without.length) out.push(el('div', {class: 'note btn-row'}, el('span', {style: {flex: 1}}, `Left out: ${override.without.join(', ')}`), el('button', {class: 'btn', onclick: () => save({...override, without: []}).catch(showError)}, 'Put back')))
    if (clip.override) out.push(el('div', {class: 'note'}, el('p', {style: {'margin-bottom': '6px'}}, 'This clip has a choice of its own. It takes effect with the next plan run, and the clip then goes stale.'), el('div', {class: 'btn-row'}, planButton, el('button', {class: 'btn', onclick: () => save(null).catch(showError)}, 'Back to the plan'))))
    return out
}

function chain(clip) {
    const later = []
    for (let next = clip.next; next; next = state.project.clips.find(c => c.id === next)?.next) later.push(next)
    return later
}

async function renderAgain(clip) {
    const asked = await api('estimate', {clips: [clip.id]}).catch(() => ({risks: []}))
    const later = chain(clip)
    const yes = await ask({
        title: `${clip.video ? 'Render' : 'Render'} ${clip.id}${clip.video ? ' again' : ''}?`,
        lines: [clip.video ? 'A new seed. The version there now is put away and stays selectable.' : '', asked.estimate].filter(Boolean),
        warnings: [
            ...(asked.risks ?? []),
            ...(asked.fixedSeed !== undefined ? [`"seed" is fixed in config.json (${asked.fixedSeed}): the same seed gives the same clip again.`] : []),
            ...(later.length ? [`${later.join(', ')} go on from this clip. They go stale and are not rendered on their own.`] : []),
        ],
        confirm: 'Render it',
        render: true,
    })
    if (yes) await startRun({type: 'clips', ids: [clip.id], again: !!clip.video})
}

async function previewOne(clips, label) {
    const yes = await ask({title: `Preview ${label}?`, lines: ['A cheap render into previews/: fewer steps, a fraction of the pixels. It never replaces a clip.'], warnings: clips.some(c => c.startsFrom) ? ['A clip that goes on from another starts on the last frame of its preview and is marked as approximate.'] : [], confirm: 'Preview', render: true})
    if (yes) await startRun({type: 'clips', ids: clips.map(c => c.id), preview: true, again: clips.some(c => c.preview)})
}

function retakeSection(clip) {
    const seconds = clip.end - clip.start
    const from = el('input', {type: 'number', min: 0, max: seconds, step: 0.1, value: 0, style: {width: '76px'}, 'aria-label': 'From second'})
    const to = el('input', {type: 'number', min: 0, max: seconds, step: 0.1, value: Math.min(2, seconds).toFixed(1), style: {width: '76px'}, 'aria-label': 'To second'})
    const hasLines = (a, b) => clip.lines.some(line => line.at < b && (line.end ?? seconds) > a)
    const go = async (range, a, b) => {
        if (state.project.kind === 'film' && hasLines(a, b)) return showError(new Error('A part with dialogue cannot be rendered on its own yet: the sound of a film comes with the picture.'))
        const yes = await ask({
            title: `Render ${clip.id}: ${range} again?`,
            lines: ['Only this part, between the frames around it. The whole clip is put away first and stays selectable. The final video is not assembled on its own.'],
            warnings: ['Not proven yet: on a 32 GB Radeon the two-pass job ran out of memory, and one try took the server down (#157).', ...b >= seconds - 0.05 && clip.next ? [`This part reaches the end of the clip: ${chain(clip).join(', ')} go on from its last frame and are marked.`] : []],
            confirm: 'Render it anyway',
            render: true,
        })
        if (yes) await startRun({type: 'retake', clip: clip.id, range}).catch(showError)
    }
    return el('div', {class: 'section'}, el('h3', {}, 'Render a part again'),
        clip.shots.length > 1 ? el('div', {class: 'btn-row', style: {'margin-bottom': '6px'}}, clip.shots.map((shot, n) => {
            const end = clip.shots[n + 1]?.at ?? seconds
            return el('button', {class: 'btn', title: `${shot.at}s - ${end.toFixed(1)}s`, onclick: () => go(`shot${n + 1}`, shot.at, end).catch(showError)}, `Shot ${n + 1}`)
        })) : '',
        el('div', {class: 'btn-row'}, from, el('span', {class: 'muted'}, 'to'), to, el('span', {class: 'muted'}, 's'),
            el('button', {class: 'btn', onclick: () => {
                const a = Number(from.value), b = Number(to.value)
                if (!(b > a)) return showError(new Error('the end of the part has to be after its start'))
                go(`${a}-${b}`, a, b).catch(showError)
            }}, 'Render this part')))
}

function renderPanel(clip) {
    const fresh = stateOf(clip)
    const facts = (...rows) => el('dl', {class: 'facts'}, rows.filter(([, value]) => value !== undefined && value !== '').flatMap(([name, value]) => [el('dt', {}, name), el('dd', {}, value)]))
    const jump = id => el('button', {class: 'link', onclick: () => seek(state.project.clips.find(c => c.id === id).start)}, id)
    const out = []
    if (fresh === 'stale') out.push(el('div', {class: 'warn'}, 'Made from another prompt, picture or start frame than the plan has now.'))
    out.push(el('div', {class: 'section btn-row'},
        el('button', {class: 'btn primary', onclick: () => renderAgain(clip).catch(showError)}, clip.video ? 'Render again' : 'Render'),
        el('button', {class: 'btn', onclick: () => previewOne([clip], clip.id).catch(showError)}, clip.preview ? 'Preview again' : 'Preview')))
    if (clip.video) out.push(retakeSection(clip))
    out.push(el('div', {class: 'section'}, el('h3', {}, 'File'), facts(
        ['Video', clip.video ? el('a', {href: mediaUrl(clip.video), target: '_blank', rel: 'noopener'}, clip.video.file) : 'not rendered'],
        ['Preview', clip.preview ? el('a', {href: mediaUrl(clip.preview), target: '_blank', rel: 'noopener'}, clip.preview.file) : undefined],
        ['Workflow', clip.video?.workflow],
        ['Size', clip.video?.size],
        ['Seed', clip.video?.seed === undefined ? undefined : String(clip.video.seed)],
        ['Frames', clip.video?.renderedFrames ? `${clip.frames} of ${clip.video.renderedFrames} used` : `${clip.frames}`],
        ['From frame', String(clip.frameStart)],
    )))
    if (clip.startsFrom || clip.next) {
        out.push(el('div', {class: 'section'}, el('h3', {}, 'Goes on'), facts(
            ['From', clip.startsFrom ? jump(clip.startsFrom) : undefined],
            ['Into', clip.next ? jump(clip.next) : undefined],
        )))
    }
    const frames = [['First frame', clip.firstFrame], ['Last frame', clip.lastFrame]].filter(([, frame]) => frame)
    if (frames.length) {
        out.push(el('div', {class: 'section'}, el('h3', {}, 'Frames'), el('div', {class: 'frames'}, frames.map(([name, frame]) => el('figure', {},
            el('img', {src: thumbUrl(frame, 640), alt: name, loading: 'lazy', decoding: 'async', onclick: () => openViewer(frame, name, clip.id)}),
            el('figcaption', {}, name))))))
    }
    const command = `${state.project.command} --render=videos --only=${clip.id}${clip.video ? ' --again' : ''}`
    out.push(el('div', {class: 'section'}, el('h3', {}, 'The same in the terminal'), copyable(command)))
    return out
}

function versionsPanel(clip) {
    if (state.versions?.clip !== clip.id) {
        api(`versions/${clip.id}`).then(({versions}) => {
            state.versions = {clip: clip.id, list: versions}
            if (state.clip === clip && state.tab === 'versions') renderInspector()
        }).catch(showError)
        return [el('div', {class: 'empty'}, 'Looking…')]
    }
    if (!state.versions.list.length) return [el('div', {class: 'empty'}, 'No older versions. What is rendered again is kept here.')]
    const sources = {again: 'rendered again', stale: 'from an older plan', leak: 'had a grey backdrop'}
    return [el('div', {class: 'section'}, state.versions.list.map(version => el('article', {class: 'version'},
        version.firstFrame ? el('img', {src: thumbUrl({file: version.firstFrame}), alt: '', loading: 'lazy'}) : el('span', {class: 'noimg'}),
        el('div', {},
            el('div', {}, dateOf(version.made)),
            el('div', {class: 'muted'}, [sources[version.source], version.seed !== undefined ? `seed ${version.seed}` : '', version.size].filter(Boolean).join(' · ')),
            version.fromThisPlan === false ? el('div', {class: 'muted', style: {color: 'var(--stale)'}}, 'Made from another plan: it will count as stale.') : '',
            el('div', {class: 'btn-row'},
                clip.video ? el('button', {class: 'btn', onclick: () => compare(clip, version)}, 'Compare') : '',
                el('button', {class: 'btn', onclick: () => pickVersion(clip, version).catch(showError)}, 'Make current'))))))]
}

async function pickVersion(clip, version) {
    const later = chain(clip)
    const yes = await ask({
        title: `Make this version of ${clip.id} the current one?`,
        lines: ['What is there now is put away and stays selectable. The final video is then older than its clips.'],
        warnings: [
            ...(version.fromThisPlan === false ? ['It was made from another plan and counts as stale.'] : []),
            ...(version.source === 'leak' ? ['It has only its video. Its first and last frame are made by the next run.'] : []),
            ...(later.length ? [`${later.join(', ')} go on from this clip and are marked.`] : []),
        ],
        confirm: 'Make it current',
    })
    if (!yes) return
    if (state.playing) setPlaying(false)
    await api(`versions/${clip.id}/pick`, {version: version.id})
    state.versions = undefined
    await loadProject()
    // what was just made current is to be seen: not a final video without it
    state.sourceChosen = false
    localStorage.removeItem(sourceKey())
    renderSourceChoice()
    seek(state.t)
    toast(`${clip.id} is now that version`)
}

function compare(clip, version, {fresh = false} = {}) {
    const dialog = $('compare')
    const a = el('video', {src: mediaUrl(clip.video), controls: true, preload: 'auto', playsInline: true})
    const b = el('video', {src: mediaUrl({file: version.video}), controls: true, preload: 'auto', muted: true, playsInline: true})
    const together = async () => {
        b.currentTime = a.currentTime = 0
        await Promise.all([a.play(), b.play()]).catch(() => {})
    }
    const close = () => { a.pause(); b.pause(); dialog.close() }
    dialog.replaceChildren(
        el('div', {class: 'pair'},
            el('div', {}, el('p', {class: 'muted'}, fresh ? 'Just rendered' : 'Now'), a),
            el('div', {}, el('p', {class: 'muted'}, `${dateOf(version.made)}${version.seed !== undefined ? ` · seed ${version.seed}` : ''}`), b)),
        el('div', {class: 'btn-row'},
            el('button', {class: 'btn primary', onclick: together}, 'Play both from the start'),
            el('div', {class: 'spacer'}),
            el('button', {class: 'btn', onclick: () => { close(); pickVersion(clip, version).catch(showError) }}, fresh ? 'Go back to the old one' : 'Make the right one current'),
            el('button', {class: fresh ? 'btn primary' : 'btn', onclick: close}, fresh ? 'Keep the new one' : 'Close')))
    dialog.showModal()
}
$('compare').addEventListener('close', () => { for (const node of $('compare').querySelectorAll('video')) node.pause() })

function copyable(text) {
    const button = el('button', {title: 'Copy', 'aria-label': 'Copy', onclick: async () => {
        await navigator.clipboard.writeText(text)
        button.textContent = '✓'
        setTimeout(() => button.replaceChildren(copyIcon()), 1200)
    }}, copyIcon())
    // a command breaks between its words, not at the dashes of an option
    const words = text.split(' ').flatMap((word, n) => [n ? ' ' : '', el('span', {style: {display: 'inline-block'}}, word)])
    return el('div', {class: 'cmd'}, el('code', {}, words), button)
}
function copyIcon() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    svg.setAttribute('class', 'icon')
    svg.setAttribute('viewBox', '0 0 24 24')
    svg.innerHTML = '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'
    return svg
}

////////// TIMELINE
// a colour per section or scene name, the same one wherever it comes back
const HUES = [25, 255, 145, 320, 80, 200, 0, 290]

function renderTimeline() {
    const {project} = state
    const hues = new Map()
    for (const group of project.groups) if (!hues.has(group.label)) hues.set(group.label, HUES[hues.size % HUES.length])
    const span = (s, d) => ({'--s': s, '--d': d})
    $('groups-label').textContent = project.kind === 'film' ? 'Scenes' : 'Sections'
    $('lines-label').textContent = project.kind === 'film' ? 'Lines' : 'Sung'
    $('groups').replaceChildren(...project.groups.map(group => el('div', {class: 'group', title: group.label, style: {...span(group.start, group.end - group.start), '--h': hues.get(group.label)}}, group.label)))
    $('clips').replaceChildren(...project.clips.map(clip => {
        const seconds = clip.end - clip.start
        const stand = clip.firstFrame ?? clip.pictures.find(p => p.kind === 'location' && p.exists) ?? clip.pictures.find(p => p.exists)
        return el('button', {class: `clip ${stateOf(clip)}${clip === state.clip ? ' selected' : ''}${flagged(clip) ? ' flagged' : ''}${state.marked.has(clip.id) ? ' marked' : ''}`, 'data-id': clip.id, title: clip.marks.map(m => m.text).join('\n'), style: span(clip.start, seconds), 'aria-label': `${clip.id}, ${STATE_CHIPS[stateOf(clip)][0]}${clip.marks.length ? `, ${plural(clip.marks.length, 'mark')}` : ''}`, onclick: event => clickClip(event, clip)},
            stand && el('img', {src: thumbUrl(stand), alt: '', decoding: 'async', draggable: false}),
            clip.shots.slice(1).map(shot => el('span', {class: 'tick', style: {left: `${shot.at / seconds * 100}%`}})),
            el('span', {class: 'tag'}, clip.id.replace(/^\D+/, '')),
            clip.startsFrom && el('span', {class: 'goes', title: `Goes on from ${clip.startsFrom}. ${TERMS['Goes on']}`}),
            clip.marks.length ? el('span', {class: 'flag'}) : '',
            clip.preview ? el('span', {class: 'has-preview', title: clip.preview.approximate ? 'Has an approximate preview' : 'Has a preview'}, 'P') : '',
            state.marked.has(clip.id) ? el('span', {class: 'ticked'}, '✓') : '')
    }))
    $('lines').replaceChildren(...project.clips.flatMap(clip => clip.lines.map(line => {
        const end = line.end ?? clip.end - clip.start
        return el('div', {class: 'spoken', title: line.who ? `${line.who}: ${line.text}` : line.text, style: span(clip.start + line.at, Math.max(0.1, end - line.at))}, el('span', {}, line.text))
    })))
    renderSourceChoice()
    renderSummary()
}

function renderSummary() {
    const {project} = state
    const clips = project.clips
    const missing = clips.filter(c => !c.video).length
    const stale = clips.filter(c => stateOf(c) === 'stale').length
    const pinned = clips.filter(c => stateOf(c) === 'pinned').length
    const marked = clips.filter(c => c.marks.length).length
    const flaggedCount = clips.filter(flagged).length
    const stalePictures = project.pictures.filter(p => state.fresh.pictures[p.id] === 'stale').length
    const missingPictures = project.pictures.filter(p => !p.exists).length
    const final = {missing: ['No final video', 'chip'], current: ['Final video current', 'chip good'], older: ['Final video older than its clips', 'chip stale']}[project.final.state]
    const last = project.lastRun
    const runChip = last && {running: ['Running', 'chip good'], failed: ['Last run failed', 'chip bad'], stopped: ['Last run stopped', 'chip bad']}[last.state]
    const next = state.status?.next
    $('chips').replaceChildren(
        el('span', {class: 'chip'}, project.kind === 'film' ? 'Film' : 'Music video'),
        el('span', {class: final[1]}, project.final.file ? el('a', {href: mediaUrl(project.final), target: '_blank', rel: 'noopener'}, final[0]) : final[0]),
        project.previewVideo ? el('a', {class: 'chip', href: mediaUrl(project.previewVideo), target: '_blank', rel: 'noopener'}, 'Preview video') : '',
        runChip ? el('span', {class: runChip[1], title: [last.command, ...last.failures].join('\n')}, runChip[0]) : '',
        last && (last.state === 'failed' || last.state === 'stopped') ? el('button', {class: 'chip', title: last.command, onclick: () => repeatLast(last).catch(showError)}, 'Repeat') : '',
        missingPictures ? el('a', {class: 'chip bad', href: `${base}/references`}, `${missingPictures} pictures missing`) : '',
        stalePictures ? el('a', {class: 'chip stale', href: `${base}/references`}, `${stalePictures} pictures stale`) : '',
        next?.command ? el('button', {class: 'chip next', title: [next.why, next.command, next.estimate].filter(Boolean).join('\n'), onclick: () => runNext(next).catch(showError)}, `Next: ${next.why}`) : '',
    )
    const item = (colour, text) => el('span', {}, el('i', {style: {background: colour}}), text)
    $('legend').replaceChildren(
        el('span', {class: 'num'}, `${clips.length - missing} of ${clips.length} clips rendered`),
        missing ? el('span', {}, el('i', {style: {background: 'repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px)'}}), `${missing} missing`) : '',
        stale ? item('var(--stale)', `${stale} stale`) : '',
        pinned ? el('span', {}, `${pinned} pinned`) : '',
        marked ? item('var(--danger)', `${plural(marked, 'mark')}`) : '',
        clips.some(c => c.startsFrom) ? el('span', {}, el('i', {style: {background: 'var(--accent)', 'border-radius': '50%'}}), 'goes on') : '',
        flaggedCount ? el('label', {}, el('input', {type: 'checkbox', checked: state.onlyFlagged, onchange: event => {
            state.onlyFlagged = event.target.checked
            $('clips').classList.toggle('dimmed', state.onlyFlagged)
        }}), 'Only flagged') : '',
        flaggedCount ? el('button', {title: 'The flagged clip before', onclick: () => stepFlagged(-1)}, '‹') : '',
        flaggedCount ? el('button', {title: 'The next flagged clip', onclick: () => stepFlagged(1)}, '›') : '',
        state.marked.size ? el('span', {class: 'num'}, `${state.marked.size} marked`) : '',
        state.marked.size ? el('button', {onclick: () => renderMarked().catch(showError)}, 'Render marked') : '',
        state.marked.size ? el('button', {onclick: () => previewOne(markedClips(), plural(markedClips().length, 'clip')).catch(showError)}, 'Preview marked') : '',
        state.marked.size ? el('button', {onclick: () => { state.marked.clear(); showMarks() }}, 'Clear') : '',
        flaggedCount ? el('button', {title: 'Mark all flagged clips', onclick: () => { for (const c of clips.filter(flagged)) state.marked.add(c.id); showMarks() }}, 'Mark flagged') : '',
        clips.some(c => c.video) ? el('button', {title: 'Go through the marked clips, else the flagged ones, else all: one by one, with keys', onclick: () => startReview(reviewList())}, 'Review') : '',
        clips.some(c => c.video) ? el('button', {title: 'Look through the rendered clips for a grey studio backdrop. Runs on this machine, no GPU', onclick: () => startRun({type: 'leak-scan'}).catch(showError)}, 'Scan for backdrops') : '',
        clips.length ? el('button', {title: 'Cheap renders of all clips into previews/', onclick: () => previewOne(clips, `all ${clips.length} clips`).catch(showError)}, 'Preview all') : '',
        clips.some(c => c.preview) ? el('button', {title: 'A low-resolution video of the whole thing from the previews', onclick: () => startRun({type: 'final', preview: true}).catch(showError)}, 'Preview video') : '',
    )
    $('wave-label').textContent = state.peaks ? (project.song ? 'Song' : 'Sound') : ''
    renderFailure()
}

// a run that did not finish, in words, with what to do - where what went wrong can be told surely
function renderFailure() {
    const bar = $('failbar')
    const last = state.project.lastRun
    const said = last && (last.state === 'failed' || last.state === 'stopped') ? last.explained : []
    const dismissed = sessionStorage.getItem(`dismissed:${route.kind}/${route.id}`) === last?.startedAt
    bar.hidden = !said?.length || dismissed
    if (bar.hidden) return
    bar.replaceChildren(
        el('span', {title: last.failures.join('\n')}, said.map(found => `${found.text} ${found.action}`).join(' ')),
        el('div', {class: 'spacer'}),
        el('button', {class: 'btn', onclick: () => repeatLast(last).catch(showError)}, 'Repeat'),
        el('button', {class: 'btn', 'aria-label': 'Close', onclick: () => { sessionStorage.setItem(`dismissed:${route.kind}/${route.id}`, last.startedAt); renderFailure() }}, '✕'),
    )
}

async function repeatLast(last) {
    const yes = await ask({title: 'Run this again?', lines: [last.command], confirm: 'Run it', render: true})
    if (yes) await startRun({type: 'repeat', command: last.command})
}
async function runNext(next) {
    const yes = await ask({title: next.why, lines: [next.command, next.estimate].filter(Boolean), confirm: 'Run it', render: true})
    if (yes) await startRun({type: 'next', command: next.command})
}

const scroller = $('scroll')
const fitScale = () => scroller.clientWidth / Math.max(1, state.project.seconds)
const MAX_PPS = 160

function setScale(pps, anchorTime, anchorX) {
    state.pps = clamp(pps, fitScale(), Math.max(MAX_PPS, fitScale()))
    $('track').style.setProperty('--pps', state.pps)
    $('zoom').value = String(Math.round(Math.log(state.pps / fitScale()) / Math.log(MAX_PPS / fitScale()) * 100) || 0)
    if (anchorTime !== undefined) scroller.scrollLeft = anchorTime * state.pps - anchorX
    drawCanvases()
}

function keepInView(t) {
    const x = t * state.pps
    if (x < scroller.scrollLeft || x > scroller.scrollLeft + scroller.clientWidth - 40) scroller.scrollLeft = x - 40
}

const readVar = name => getComputedStyle(document.documentElement).getPropertyValue(name)

// the canvases stay as wide as the window of the timeline and draw what is in it: a whole song at full zoom is wider than a canvas can be
function prepareCanvas(canvas, height) {
    const ratio = devicePixelRatio || 1
    const width = scroller.clientWidth
    canvas.width = Math.round(width * ratio)
    canvas.height = Math.round(height * ratio)
    canvas.style.width = `${width}px`
    canvas.style.height = `${height}px`
    const context = canvas.getContext('2d')
    context.scale(ratio, ratio)
    return {context, width}
}

function resolveColor(name) {
    // light-dark() only means something to CSS: let it say what it comes to
    const probe = $('track')
    const before = probe.style.color
    probe.style.color = `var(${name})`
    const colour = getComputedStyle(probe).color
    probe.style.color = before
    return colour
}

function drawCanvases() {
    if (!state.project || $('view-timeline').hidden) return
    drawRuler()
    drawWave()
}

function drawRuler() {
    const {context, width} = prepareCanvas($('ruler'), 22)
    const left = scroller.scrollLeft
    const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600]
    const stepSize = steps.find(s => s * state.pps >= 70) ?? 600
    context.font = `11px ${readVar('--mono')}`
    context.textBaseline = 'middle'
    const muted = resolveColor('--muted')
    context.fillStyle = muted
    context.strokeStyle = muted
    context.globalAlpha = 1
    const first = Math.floor(left / state.pps / stepSize) * stepSize
    for (let s = first; s * state.pps - left < width && s <= state.project.seconds; s += stepSize) {
        const x = Math.round(s * state.pps - left) + 0.5
        context.globalAlpha = .55
        context.beginPath()
        context.moveTo(x, 15)
        context.lineTo(x, 22)
        context.stroke()
        context.globalAlpha = 1
        context.fillText(clock(s, false), x + 4, 10)
    }
}

function drawWave() {
    const {context, width} = prepareCanvas($('wave'), 40)
    const {peaks} = state
    if (!peaks) return
    context.fillStyle = resolveColor('--muted')
    context.globalAlpha = .75
    const left = scroller.scrollLeft
    const seconds = state.project.seconds
    const middle = 20
    for (let x = 0; x < width; x += 2) {
        const from = (x + left) / state.pps / seconds * peaks.length
        const to = (x + 2 + left) / state.pps / seconds * peaks.length
        if (from >= peaks.length) break
        let peak = 0
        for (let i = Math.floor(from); i < Math.max(Math.floor(from) + 1, to) && i < peaks.length; i++) peak = Math.max(peak, peaks[i])
        const height = Math.max(1, peak * 36)
        context.fillRect(x, middle - height / 2, 1.5, height)
    }
}

// pressing and dragging on a lane without clips moves the playhead
for (const lane of [$('seek-ruler'), $('groups'), $('seek-wave'), $('lines')]) {
    lane.addEventListener('pointerdown', event => {
        const timeAt = e => (e.clientX - scroller.getBoundingClientRect().left + scroller.scrollLeft) / state.pps
        const wasPlaying = state.playing
        if (wasPlaying) setPlaying(false)
        seek(timeAt(event))
        const move = e => seek(timeAt(e))
        const up = () => {
            removeEventListener('pointermove', move)
            removeEventListener('pointerup', up)
            if (wasPlaying) setPlaying(true)
        }
        addEventListener('pointermove', move)
        addEventListener('pointerup', up)
    })
}
scroller.addEventListener('scroll', drawCanvases, {passive: true})
scroller.addEventListener('wheel', event => {
    if (!event.ctrlKey) {
        // a plain wheel moves along the timeline: it has nothing to scroll up and down
        if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) { scroller.scrollLeft += event.deltaY; event.preventDefault() }
        return
    }
    event.preventDefault()
    const x = event.clientX - scroller.getBoundingClientRect().left
    state.fitted = false
    setScale(state.pps * Math.exp(-event.deltaY * 0.002), (x + scroller.scrollLeft) / state.pps, x)
}, {passive: false})
$('zoom').addEventListener('input', () => {
    const centre = state.t * state.pps - scroller.scrollLeft
    const inView = centre >= 0 && centre <= scroller.clientWidth
    const anchorX = inView ? centre : scroller.clientWidth / 2
    const anchorTime = inView ? state.t : (scroller.scrollLeft + anchorX) / state.pps
    state.fitted = Number($('zoom').value) === 0
    setScale(fitScale() * Math.pow(MAX_PPS / fitScale(), Number($('zoom').value) / 100), anchorTime, anchorX)
})
$('fit').addEventListener('click', () => { state.fitted = true; setScale(fitScale()); scroller.scrollLeft = 0 })
new ResizeObserver(() => {
    if (!state.project || $('view-timeline').hidden) return
    setScale(state.fitted ? fitScale() : state.pps)
}).observe(scroller)

////////// CONTROLS
$('play').addEventListener('click', () => setPlaying(!state.playing))
$('prev').addEventListener('click', () => step(-1))
$('next').addEventListener('click', () => step(1))
$('mute').addEventListener('click', () => { state.muted = !state.muted; applySound() })
addEventListener('keydown', event => {
    if (event.target.matches?.('input, select, textarea') || document.querySelector('dialog[open]') || !state.project) return
    if (reviewKey(event)) return
    const actions = {
        ' ': () => setPlaying(!state.playing),
        k: () => { setPlaying(false); setSpeed(1) },
        j: () => changeSpeed(-1),
        l: () => changeSpeed(1),
        ',': () => stepFrame(-1),
        '.': () => stepFrame(1),
        o: () => toggleLoop(false),
        O: () => toggleLoop(true),
        f: () => toggleFullscreen(),
        '?': () => openHelp(),
        ArrowLeft: () => step(-1),
        ArrowRight: () => step(1),
        Home: () => seek(0),
        End: () => seek(state.project.seconds - 0.01),
        m: () => { state.muted = !state.muted; applySound() },
    }
    const action = actions[event.key]
    if (!action || event.ctrlKey || event.metaKey || event.altKey) return
    event.preventDefault()
    action()
})

////////// DATA - the folder is the model: read again now and then, and when the window comes back
async function loadProject({first = false} = {}) {
    const response = await fetch(`${base}/api/project`)
    // a run can be writing a file just as it is read: what is on the page stays
    if (!response.ok) {
        if (first) throw new Error((await response.json()).error)
        return
    }
    const text = await response.text()
    if (text === state.projectText) return
    state.projectText = text
    const selected = state.clip?.id
    state.project = JSON.parse(text)
    document.title = `${state.project.title} · Workspace`
    $('title').textContent = state.project.title
    $('time-all').textContent = clock(state.project.seconds, false)
    $('track').style.setProperty('--seconds', state.project.seconds)
    if (state.project.song) {
        const url = mediaUrl(state.project.song)
        if (song.dataset.url !== url) { song.dataset.url = url; song.src = url }
    }
    state.clip = state.project.clips.find(c => c.id === selected)
    state.versions = undefined
    loadFreshness()
    loadStatus()
    if (first) return
    // the plan or a render changed while the page was open: the same place, in what is there now
    renderTimeline()
    renderInspector()
    setScale(state.fitted ? fitScale() : state.pps)
    if (!state.playing) showClip(state.clip, state.clip ? state.t - state.clip.start : 0)
    loadWaveform()
}

async function loadFreshness() {
    const response = await fetch(`${base}/api/freshness`)
    if (!response.ok) return
    state.fresh = await response.json()
    for (const node of $('clips').children) {
        const clip = state.project.clips.find(c => c.id === node.dataset.id)
        if (!clip) continue
        node.classList.remove('stale', 'current', 'pinned', 'unknown', 'missing')
        node.classList.add(stateOf(clip))
        node.classList.toggle('flagged', flagged(clip))
    }
    renderSummary()
    renderInspector()
}

async function loadStatus() {
    const response = await fetch(`${base}/api/status`)
    if (!response.ok) return
    state.status = await response.json()
    renderSummary()
}

async function loadWaveform() {
    const response = await fetch(`${base}/api/waveform`)
    if (!response.ok) return
    state.peaks = (await response.json()).peaks ?? undefined
    renderSummary()
    drawWave()
}

async function timelinePage() {
    await loadProject({first: true})
    show('view-timeline')
    projectChrome(state.project.title)
    renderTimeline()
    state.fitted = true
    setScale(fitScale())
    const wanted = state.project.clips.find(c => c.id === location.hash.slice(1)) ?? state.project.clips[0]
    if (wanted) seek(wanted.start)
    else { renderInspector(); showClip(undefined, 0) }
    applySound()
    loadWaveform()
    run.onEnd = current => loadProject().then(() => afterRender(current)).catch(() => {})
    followRun(base)
    setInterval(() => { if (!document.hidden) loadProject().catch(() => {}) }, 10000)
    addEventListener('focus', () => loadProject().catch(() => {}))
}

loadServers()
setInterval(() => { if (!document.hidden) loadServers() }, 10000)

const pages = {home: homePage, library: libraryPage, project: () => route.page === 'references' ? referencesPage() : route.page === 'casting' ? castingPage() : timelinePage()}
pages[route.view]().catch(error => {
    show('none')
    $('boot').hidden = false
    $('boot').replaceChildren(el('div', {}, el('p', {}, 'This cannot be read right now.'), el('p', {}, el('code', {}, error.message))))
})
</script>
</body>
